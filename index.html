<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日記帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>每日記帳</title>
<style>
:root{--pri:#4caf8f;--bg:#000;--card:#1c1c1e;--tx:#fff;--sub:#8e8e93;--line:#2a2a2c;--exp:#e5594f;--inc:#6fae72;--dim:#141414;--safe-b:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f4;--card:#fff;--tx:#222;--sub:#8a9490;--line:#e6eae8;--inc:#2f9e6e;--dim:#e9ecea}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#wrap{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
#app{flex:1;overflow-y:auto;padding:0 0 72px}
header{background:var(--bg);color:var(--tx);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header select,header button{background:var(--line);color:var(--tx);border:0;border-radius:8px;padding:6px 10px;font-size:14px}
header.top{justify-content:space-between;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
header .ib{background:none;padding:6px;line-height:0}
header.top .ib svg{width:22px;height:22px}
header.top .ib:nth-of-type(3) svg{width:28px;height:28px}
header.top .ib:nth-of-type(4) svg{width:20px;height:20px}
.seg2{display:flex;border:1.5px solid var(--tx);border-radius:12px;overflow:hidden}
header .seg2 button{background:var(--bg);color:var(--tx);border-radius:0;padding:7px 19px;font-size:12.5px;line-height:1.2}
header .seg2 button.on{background:var(--tx);color:var(--bg)}
.mt{display:flex;align-items:center;justify-content:space-between;padding:4px 8px}
.mt button{background:none;border:0;color:var(--sub);font-size:34px;font-weight:200;line-height:1;padding:0 12px}
.mt .mtt{color:var(--tx);font-size:22px;font-weight:400;padding:10px 6px}.mt .mtt small{font-size:11px;margin-left:2px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--sub);font-size:10px;padding:6px 0 8px;border-bottom:1px solid var(--line)}
.sb{background:var(--dim);color:var(--sub);font-size:17px;padding:9px 16px;border-bottom:1px solid var(--line)}
header select option{color:#000}
.mnav{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px;font-weight:600}
.mnav button{background:none;border:0;font-size:22px;color:var(--pri);padding:0 10px}
.sumcard{background:var(--card);margin:0 12px 10px;border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.sumcard small{color:var(--sub);display:block;font-size:12px}
.sumcard b{font-size:17px}
.e{color:var(--exp)}.i{color:var(--inc)}.t{color:var(--sub)}
.bud{grid-column:1/-1;text-align:left;margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--pri)}
.bar.over>i{background:var(--exp)}
.dh{display:flex;justify-content:space-between;padding:8px 16px;font-size:13px;color:var(--sub)}
.row{display:flex;align-items:center;gap:10px;background:var(--bg);padding:8px 14px;border-bottom:1px solid var(--line)}
.ic{width:30px;height:30px;display:grid;place-items:center;font-size:20px;flex:none}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:500}.mid small{display:block;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.row .amt.e{color:var(--tx)}.row .amt.t{color:var(--sub)}
.rt{text-align:right}.rt small{display:block;color:var(--sub);font-size:16px}
.mo{color:var(--sub);font-size:18px;padding-left:2px}
.mid b{font-size:18px;font-weight:400}.mid small{font-size:15px}
.empty{text-align:center;color:var(--sub);padding:50px 20px}
nav{display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b);position:absolute;bottom:0;left:0;right:0;z-index:6}
.tab{flex:1;background:none;border:0;padding:7px 0 5px;color:var(--sub);font-size:10px}
.tab svg{display:block;margin:0 auto 3px;width:25px;height:25px}.tab.on{color:var(--tx)}
.card{background:var(--card);margin:10px 12px;border-radius:14px;padding:12px}
.card h3{margin:0 0 8px;font-size:15px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;color:var(--tx);font-size:15px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal .d{height:44px;border-bottom:1px solid var(--line);text-align:center;padding-top:8px}
.cal .d:nth-last-child(-n+7){border-bottom:0}
.cal .d .n{white-space:nowrap;display:inline-block;min-width:28px;line-height:24px;font-size:18px;border-radius:15px}
.cal .d.has .n{color:var(--inc)}
.cal .d.o{background:var(--dim)}.cal .d.o .n{color:var(--sub)}
.cal .d.hol .n{color:var(--exp)}
.cal .d.today .n{background:var(--exp);color:#fff;font-size:18px;padding:3px 5px;margin-top:-3px}
.cal .d.sel .n{box-shadow:0 0 0 2px var(--tx) inset}.cal .d.today.sel .n{box-shadow:none}
.dots{display:flex;gap:3px;justify-content:center;margin-top:5px;height:4px}
.dots i{width:3.5px;height:3.5px;border-radius:50%;background:var(--tx);opacity:.85}
.dots i.g{background:#4caf50;opacity:1}
.pie{width:190px;height:190px;display:block;margin:4px auto}
.leg{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.leg i{width:12px;height:12px;border-radius:3px;flex:none}.leg span{flex:1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.shb{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
.shb h3{margin:0 0 10px}
label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
label>input,label>select{flex:1;max-width:62%;text-align:right;border:0;background:none;color:var(--tx);font-size:16px;outline:none}
.big{width:100%;font-size:34px;text-align:center;border:0;background:none;color:var(--tx);outline:none;padding:8px 0}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.cats button{border:2px solid transparent;background:var(--bg);border-radius:10px;padding:6px 0;color:var(--tx);font-size:11px}
.cats button span{display:block;font-size:22px}.cats button.on{border-color:var(--pri)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;padding:12px;margin-top:12px}
.btn.ghost{background:var(--line);color:var(--tx)}.btn.danger{background:none;color:var(--exp)}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li button{background:none;border:0;color:var(--exp)}
.mrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--line)}
.mrow small{color:var(--sub)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.sw button{width:42px;height:42px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--tx)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lock.on{display:flex}#lock input{font-size:28px;text-align:center;width:180px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--tx)}
.srch{padding:8px 12px}.srch input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px}
.acc-h{padding:8px 16px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
#page{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);z-index:15;display:none;flex-direction:column;color:var(--tx)}
#page.on{display:flex}
.pg-h{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;border-bottom:1px solid var(--line);flex:none}
.pg-h button{background:none;border:0;color:var(--tx);font-size:16px;padding:6px 4px}
.pg-h .l{text-align:left;white-space:nowrap}.pg-h .l.x{font-size:22px;line-height:1}.pg-h .r{text-align:right;white-space:nowrap}
.pg-h h2{margin:0;font-size:17px;font-weight:500;text-align:center}
.seg3{display:flex;border:1.5px solid var(--tx);border-radius:9px;overflow:hidden;justify-self:center}
.seg3 button{padding:6px 15px;font-size:13px;line-height:1.2;border-radius:0}
.seg3 button.on{background:var(--tx);color:var(--bg)}
.pg-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pg-date{display:block;position:relative;text-align:center;font-size:19px;padding:18px 0;background:var(--dim)}
.pg-date input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pr{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card);border-bottom:1px solid var(--line);font-size:17px}
.pr .pi{width:26px;text-align:center;font-size:19px;flex:none}
.pr .pl{flex:none}
.pr .pv{flex:1;text-align:right;min-width:0}
.pr .pv small{display:block;color:var(--sub);font-size:12px}
.pr .ph{color:var(--sub)}
.pr .chv{color:var(--sub);font-size:22px;line-height:1}
.pr.d{background:var(--dim);color:var(--sub)}
.pr.d .pl{flex:1}
.pr select{flex:1;text-align:right;text-align-last:right;background:none;border:0;color:var(--tx);font-size:17px;outline:none}
.pr .ai{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none}
.blue{color:#3b82f6;font-size:20px}
.note{display:block;width:100%;min-height:130px;border:0;outline:none;resize:none;background:var(--dim);color:var(--tx);font:inherit;font-size:16px;padding:14px 16px}
.thumbs{display:flex;gap:8px;padding:10px 16px;background:var(--dim)}
.th{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--line);display:grid;place-items:center;color:var(--sub)}
.th img{width:100%;height:100%;object-fit:cover}
.pg-foot{display:flex;gap:12px;padding:10px 12px calc(10px + var(--safe-b));flex:none;background:var(--bg)}
.pg-foot button{flex:1;border:1.5px solid var(--tx);background:none;color:var(--tx);border-radius:6px;padding:12px;font-size:16px}
.pg-foot button.dg{color:var(--exp);border-color:var(--exp)}
#page.kp-on .pg-foot{display:none}
.kp{display:none;background:var(--card);padding-bottom:var(--safe-b);flex:none}
#page.kp-on .kp{display:block}
.kp-top{display:flex;align-items:center;gap:2px;padding:0 6px;height:46px;border-bottom:1px solid var(--line)}
.kp-top button{background:none;border:0;color:var(--tx);font-size:19px;padding:8px 14px}
.kp-top .sp{flex:1}
.kp-g{display:grid;grid-template-columns:repeat(4,1fr)}
.kp-g button{height:54px;background:var(--card);border:0;border-right:.5px solid var(--line);border-bottom:.5px solid var(--line);color:var(--tx);font-size:22px}
.kp-g button.op{color:var(--sub)}
.kp-g button:active,.kp-top button:active{background:var(--line)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px}
.cg button{position:relative;background:var(--card);border:0;color:var(--tx);height:88px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.cg button span{font-size:30px;line-height:1}
.cg button .plus{color:#4caf50;font-size:34px}
.cg .ck{position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:#fff;color:#000;font-size:12px;line-height:20px;text-align:center;font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 4px}
.chip{border:0;border-radius:18px;padding:9px 16px;background:var(--line);color:var(--tx);font-size:15px}
.chip.on{background:var(--tx);color:var(--bg)}.chip.add{color:var(--sub)}
.emp{color:var(--sub);font-size:13px;padding:10px 14px}
#bpage{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);z-index:14;display:none;flex-direction:column;color:var(--tx)}
#bpage.on{display:flex}
.pg-h.w{grid-template-columns:1fr auto 1fr}
.pg-h.w .ic2{display:flex;justify-content:flex-end;gap:10px}
.pg-h.w .ic2 button{padding:4px;line-height:0}
.seg3.big button{padding:7px 18px;font-size:13px}
.bsum{display:flex;align-items:center;gap:22px;padding:4px 20px 14px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:24px}
.ring small{font-size:12px;margin:6px 0 0 1px}
.bsl{flex:1;min-width:0}
.bsl>div{display:flex;justify-content:space-between;align-items:center;font-size:19px;padding:5px 0}
.bsl b{font-weight:400}
.bsl .bv{display:flex;align-items:center;gap:14px}
.pen{background:none;border:0;color:var(--tx);padding:0;line-height:0}
.bh{display:flex;justify-content:space-between;padding:12px 14px;background:var(--dim);color:var(--sub);font-size:17px}
.br{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.br.ed{background:var(--card)}
.br .bm{flex:1;min-width:0}
.br .t1{display:flex;justify-content:space-between;align-items:center;font-size:19px}
.bamt{font-size:19px}.bamt.un{color:var(--sub)}
.bbar{height:3px;background:var(--line);margin:7px 0 5px;position:relative;border-radius:2px}
.bbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.br .t2{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}
.neg{color:var(--exp)}
.bstat{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:8px 0 calc(10px + var(--safe-b));border-top:1px solid var(--line);flex:none}
.bstat b{display:block;font-size:19px;font-weight:400}.bstat small{color:var(--sub);font-size:13px}
.bkp{background:var(--card);flex:none;padding-bottom:var(--safe-b)}
.kbar{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line)}
.kbar button{background:none;border:0;color:#3b82f6;font-size:17px}
.bedit{display:inline-flex;align-items:center;gap:6px;font-size:19px}
.caret{display:inline-block;width:2px;height:20px;background:#3b82f6}
.bedit button{background:none;border:0;color:var(--sub);font-size:18px;padding:0}
.sb2{background:var(--dim);color:var(--tx);font-size:17px;padding:10px 14px;border-bottom:1px solid var(--line)}
#apage{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);z-index:13;display:none;flex-direction:column;color:var(--tx)}
#apage.on{display:flex}
#apage .bkp{display:none}#apage.kp-on .bkp{display:block}
.i{color:var(--inc)}.z{color:var(--sub)}
.as-top{position:relative;padding:12px 14px 14px;text-align:center}
.as-top .cur{position:absolute;left:14px;top:12px;border:1px solid var(--sub);color:var(--sub);font-size:13px;padding:0 5px;border-radius:3px}
.as-top .per{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--sub);font-size:14px}
.as-top .bal{font-size:26px;padding-top:18px}
.as-top .bal small{display:block;color:var(--tx);font-size:14px;margin-top:2px}
.as-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.as-stats b{display:block;font-size:20px;font-weight:400}.as-stats small{font-size:14px}
.as-stats.s2{border-top:0}
.gh{background:var(--dim);color:var(--sub);padding:10px 14px;font-size:16px}
.gr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.gr .gl{line-height:1.5;color:var(--sub);font-size:17px}.gr .gb{color:var(--sub);font-size:17px}
.as-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px calc(8px + var(--safe-b));border-top:1px solid var(--line);flex:none}
.as-bar button{background:none;border:0;color:var(--tx)}
.as-bar .plus{line-height:0;padding:6px}.as-bar .draw{font-size:18px}
.seg4{display:flex;background:var(--card);border-radius:8px;padding:2px}
.seg4 button{padding:6px 22px;font-size:14px;border-radius:6px;color:var(--sub)}
.seg4 button.on{background:#48484a;color:var(--tx)}
.seg5{display:flex;background:var(--card);border-radius:8px;padding:2px;margin:6px 10px 10px}
.seg5 button{flex:1;padding:6px 0;font-size:14px;border:0;border-radius:6px;background:none;color:var(--sub)}
.seg5 button.on{background:#48484a;color:var(--tx)}
.dh2{background:var(--dim);padding:9px 14px;font-size:17px}
.dh2 small{display:block;color:var(--sub);font-size:15px;margin-top:2px}
.pin{flex:1;min-width:0;text-align:right;background:none;border:0;outline:none;color:var(--tx);font-size:17px}
.pr .pv.i{color:var(--inc)}
.tg{position:relative;width:51px;height:31px;display:inline-block;margin-left:auto}
.tg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;z-index:1}
.tg i{position:absolute;inset:0;background:#39393d;border-radius:16px;transition:.2s}
.tg i::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+i{background:#34c759}.tg input:checked+i::after{transform:translateX(20px)}
.pr:has(.tg){justify-content:space-between}
.delrow{color:var(--exp);text-align:center;padding:14px;margin-top:14px;background:var(--card);font-size:17px}
.ip{display:grid;place-items:center;padding:18px}.ip .ai{width:64px;height:64px;font-size:32px}
.igrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:12px 14px}
.igrid button{aspect-ratio:1;border:2px solid transparent;border-radius:50%;background:var(--card);font-size:22px;display:grid;place-items:center;padding:0}
.igrid button.on{border-color:var(--tx)}
.igrid button i{width:70%;height:70%;border-radius:50%;display:block}
.acc-off{opacity:.45}
.ai{border-radius:50%;display:grid;place-items:center;flex:none;width:32px;height:32px;font-size:17px}
.row .ai{margin-right:2px}

.ncrow{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.ncic{font-size:26px;width:30px;text-align:center}
.ncrow input{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--tx);font-size:17px}
.ncrow .x{color:var(--exp);font-size:16px}
.seg6{display:flex;background:var(--card);border-radius:8px;padding:2px;margin:12px 10px}
.seg6 button{flex:1;padding:7px;border:0;background:none;color:var(--sub);border-radius:6px;font-size:15px}
.seg6 button.on{background:#48484a;color:var(--tx)}
.egrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 10px}
.egrid button{aspect-ratio:1;background:none;border:0;font-size:28px;border-radius:10px;padding:0}
.egrid button.on{background:var(--line)}
#rpage{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);z-index:13;display:none;flex-direction:column;color:var(--tx)}
#rpage.on{display:flex}
.sched{white-space:pre-wrap;font:inherit;font-size:15px;line-height:1.5;color:var(--sub);padding:18px 14px 0;margin:0}
.rdel{background:none;border:0;color:var(--exp);font-size:16px;padding:6px}
.sech{background:var(--dim);color:var(--sub);padding:9px 14px;font-size:15px}
header.ctr h1{text-align:center}
.mrow small{font-size:16px}
.meals .mchip{margin-left:6px;padding:5px 12px;border-radius:16px;border:1px solid var(--dim);background:none;color:var(--tx);font-size:15px}.meals .mchip.on{background:#4caf8f;border-color:#4caf8f;color:#000}.meals .pl{flex:1}
#sheet .eatin{width:100%;box-sizing:border-box;background:transparent!important;border:0;border-bottom:1px solid var(--dim);border-radius:0;color:#fff!important;-webkit-text-fill-color:#fff;caret-color:#4caf8f;outline:none;font-size:18px;padding:12px 2px;margin:4px 0 8px}#sheet .eatin::placeholder{color:var(--sub);-webkit-text-fill-color:var(--sub)}
.ord{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--dim)}.ord .on{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ord button:not(.rdel){width:30px;height:30px;border-radius:50%;border:1px solid var(--dim);background:none;color:var(--tx);font-size:18px;line-height:1}.ord b{min-width:20px;text-align:center}.ord .pin2::placeholder{-webkit-text-fill-color:var(--sub)}.ord .pin2{width:62px;background:transparent!important;border:0;border-bottom:1px solid var(--dim);border-radius:0;color:#fff!important;-webkit-text-fill-color:#fff;text-align:right;font-size:16px;outline:none;padding:4px 2px}.ord small{min-width:44px;text-align:right;color:var(--sub)}.tot{display:flex;justify-content:space-between;padding:10px 2px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}.chip .cx{margin-left:8px;color:#e5534b;font-weight:400}
.frow{display:flex;align-items:center;gap:6px;font-size:17px}.frow span{white-space:nowrap}.frow .eatin{flex:1;min-width:0}
.fcard{margin:12px 14px 12px;padding:12px 14px;border-radius:12px;background:var(--dim);font-size:15px}.fc-h,.fc-f{display:flex;justify-content:space-between;gap:10px}.fc-h b,.fc-f b{font-weight:600}.fc-t{margin:10px 0 4px;color:var(--sub);font-size:13px}.fc-r{display:flex;gap:8px;padding:3px 0}.fc-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fc-q{color:var(--sub);min-width:28px}.fc-p{color:var(--sub);min-width:40px;text-align:right}.fc-s{min-width:50px;text-align:right}.fc-f{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<div id="wrap">
  <div id="app"></div>
  <nav>
    <button class="tab" data-id="home" data-act="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.5 3.5l2 2L11 15l-3 1 1-3z"/></svg>帳本</button>
    <button class="tab" data-id="acc" data-act="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5z"/><path d="M5 11v7M10 11v7M14 11v7M19 11v7M3 20h18"/></svg>帳戶</button>
    <button class="tab" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M4 12h16"/></svg>記一筆</button>
    <button class="tab" data-id="rep" data-act="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9h9"/></svg>圖表分析</button>
    <button class="tab" data-id="more" data-act="tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>設定</button>
  </nav>
</div>
<div id="rpage"></div>
<div id="apage"></div>
<div id="bpage"></div>
<div id="page"></div>
<div id="sheet"></div>
<div id="lock"><div style="font-size:48px">🔒</div><div>請輸入密碼</div><input id="pin" type="password" inputmode="numeric" autocomplete="off"><button class="btn" style="width:180px" id="pinOk">解鎖</button></div>

<script>
'use strict';
const KEY='mdj_ledger_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const money=n=>{n=Math.round(n*100)/100;return (n<0?'-':'')+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2});};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mShift=(m,n)=>{const [y,mo]=m.split('-').map(Number);return ymd(new Date(y,mo-1+n,1)).slice(0,7);};
const mLabel=m=>{const [y,mo]=m.split('-');return y+'年'+(+mo)+'月';};
const W=['日','一','二','三','四','五','六'];
const PAL=['#4caf8f','#f2994a','#5b8def','#e5594f','#9b6bdf','#f2c94c','#2fb5c9','#d96ba0','#8a9490','#7aa33a'];
const COLORS=['#4caf8f','#5b8def','#e5594f','#f2994a','#9b6bdf','#d96ba0','#2fb5c9','#555f5b'];
const ATYPE={cash:'現金',bank:'銀行',credit:'信用卡',epay:'電子貨幣',invest:'投資理財',borrow:'借入',lend:'借出',debit:'簽帳金融卡 (Debit)',stock:'股票',other:'其他'};
const DEF_E=[['餐飲','🍜'],['交通','🚌'],['購物','🛍️'],['娛樂','🎮'],['居家','🏠'],['醫療','💊'],['教育','📚'],['通訊','📱'],['旅遊','✈️'],['其他','📦']];
const DEF_I=[['薪資','💰'],['獎金','🎁'],['投資','📈'],['兼職','🧑‍💻'],['利息','🏦'],['其他','📦']];
const FREQ={d:'每天',wd:'平日',w:'每週',w2:'每兩週',m:'每個月',m2:'每兩個月',q:'每季',m4:'每四個月',m5:'每五個月',h:'每半年',y:'每年',y2:'每兩年'};
/* 台灣放假日（來源：人事行政總處辦公日曆表）。新增年份時補在下面；沒列出的年份只標固定日期的節日 */
const HOL_YEARS={};
const HOL=new Set();
function holRange(a,b){const d=new Date(a+'T00:00:00'),e=new Date(b+'T00:00:00');for(;d<=e;d.setDate(d.getDate()+1)){HOL.add(ymd(d));}HOL_YEARS[a.slice(0,4)]=1;}
function holDays(y,list){HOL_YEARS[y]=1;list.forEach(s=>{const [a,b]=s.split('~');holRange(y+'-'+a,y+'-'+(b||a));});}
holDays('2026',['01-01','02-14~02-22','02-27~02-28','04-03~04-04','04-06','05-01','06-19~06-20','09-25','09-28','10-09~10-10','10-25~10-26','12-25']);
holDays('2027',['01-01','02-04~02-10','02-28','03-01','04-04~04-06','04-30~05-01','06-09','09-15','09-28','10-10~10-11','10-25','12-24~12-25','12-31']);
const isHol=ds=>HOL_YEARS[ds.slice(0,4)]?HOL.has(ds):['01-01','02-28','05-01','09-28','10-10','10-25','12-25'].includes(ds.slice(5));

function seed(){
  const b=uid();
  return {v:1,books:[{id:b,name:'日常帳本'}],cur:b,
    accounts:[{id:uid(),name:'現金',type:'cash',init:0},{id:uid(),name:'銀行',type:'bank',init:0},{id:uid(),name:'信用卡',type:'credit',init:0}],
    cats:{e:DEF_E.map(([name,icon])=>({id:uid(),name,icon})),i:DEF_I.map(([name,icon])=>({id:uid(),name,icon}))},
    members:[],tx:[],budgets:{},recurring:[],set:{color:COLORS[0],pin:''}};
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.books)return s;}catch(e){}return seed();}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert('儲存失敗，裝置空間可能不足');}};
const today=()=>ymd(new Date());
let ui={view:'cal',tab:'home',month:today().slice(0,7),sel:today(),q:'',qOn:false,rtype:'e'};

/* ---------- 計算 ---------- */
function balances(upTo){
  const m={};S.accounts.forEach(a=>m[a.id]=+a.init||0);
  S.tx.forEach(t=>{
    if(upTo&&t.date>upTo)return;
    if(t.type==='e'){if(t.acc in m)m[t.acc]-=t.amt;}
    else if(t.type==='i'){if(t.acc in m)m[t.acc]+=t.amt;}
    else{if(t.acc in m)m[t.acc]-=t.amt+(t.fee||0);if(t.to in m)m[t.to]+=t.amt;}
  });
  return m;
}
function sum(prefix,book){
  let e=0,i=0;
  S.tx.forEach(t=>{if(t.book!==book||!t.date.startsWith(prefix))return;
    if(t.type==='e')e+=t.amt;else if(t.type==='i')i+=t.amt;else e+=t.fee||0;});
  return {e,i};
}
const accName=id=>S.accounts.find(a=>a.id===id)?.name||'(已刪除)';
const bookTx=()=>S.tx.filter(t=>t.book===S.cur);

/* ---------- 共用元件 ---------- */
function sheet(html,mount){
  const s=$('#sheet');
  s.innerHTML='<div class="shb">'+html+'</div>';
  s.classList.add('on');
  s.onclick=e=>{if(e.target===s)closeSheet();};
  mount&&mount(s.firstChild);
}
function closeSheet(){const s=$('#sheet');s.classList.remove('on');s.innerHTML='';}
function row(t,wd){
  const c=t.type==='t'?{icon:'🔁',name:'轉帳'}:(S.cats[t.type].find(x=>x.id===t.cat)||{icon:'❓',name:'未分類'});
  const who=t.type==='t'?accName(t.acc)+' → '+accName(t.to):(t.member||'自己');
  const sub=[wd?dLbl(t.date):'',who,t.meal,t.rest,t.dish,t.src,t.note,(t.tags||[]).map(x=>'#'+x).join(' ')].filter(Boolean).join(' | ');
  const right=t.type==='t'?(t.fee?'手續費 '+t.fee:''):accName(t.acc);
  return `<div class="row" data-act="edit" data-id="${t.id}"><span class="ic">${c.icon}</span><div class="mid"><b>${esc(c.name)}${t.photos&&t.photos.length?' 🧾':''}</b><small>${esc(sub)}</small></div><div class="rt"><span class="amt ${t.type}">${money(t.amt)}</span><small>${esc(right)}</small></div><span class="mo">⋮</span></div>`;
}
function header(title,extra){
  return `<header><h1>${title}</h1>${extra||''}</header>`;
}
function bookSel(){
  return `<select data-chg="book">${S.books.map(b=>`<option value="${b.id}" ${b.id===S.cur?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`;
}
const mnav=()=>`<div class="mnav"><button data-act="mprev">‹</button><span>${mLabel(ui.month)}</span><button data-act="mnext">›</button></div>`;

/* ---------- 明細 ---------- */
function matchQ(t){
  const q=ui.q.trim().toLowerCase();if(!q)return true;
  const c=t.type==='t'?'轉帳':(S.cats[t.type].find(x=>x.id===t.cat)?.name||'');
  return [t.note,c,t.member,accName(t.acc),(t.tags||[]).join(' '),String(t.amt)].join(' ').toLowerCase().includes(q);
}
const IC={
  book:`<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v8l2.5-2L14 11V3"/></svg>`,
  batt:`<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="5" width="8" height="16" rx="2"/><path d="M10.5 2.5h3"/><path d="M8 15h8"/></svg>`,
  search:`<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>`,
  expand:`<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>`
};
function listBody(searching){
  const list=bookTx().filter(t=>searching?matchQ(t):t.date.startsWith(ui.month)).sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
  const g={};list.forEach(t=>(g[t.date]??=[]).push(t));
  return Object.keys(g).sort().reverse().map(d=>{
    let de=0,di=0;g[d].forEach(t=>{if(t.type==='e')de+=t.amt;else if(t.type==='i')di+=t.amt;else de+=t.fee||0;});
    return `<div class="dh"><span>${d.slice(5)} 週${W[new Date(d+'T00:00:00').getDay()]}</span><span>${di?'<span class="i">收 '+money(di)+'</span> ':''}${de?'<span class="e">支 '+money(de)+'</span>':''}</span></div>`+g[d].map(row).join('');
  }).join('')||'<div class="empty">還沒有記錄<br>點下方「記一筆」開始記帳</div>';
}
function calView(){
  const [y,m]=ui.month.split('-').map(Number);
  const fd=new Date(y,m-1,1).getDay(),ld=new Date(y,m,0).getDate();
  const weeks=Math.ceil((fd+ld)/7);
  const per={};bookTx().forEach(t=>(per[t.date]??=[]).push(t));
  let cells='';
  for(let k=0;k<weeks*7;k++){
    const dt=new Date(y,m-1,1-fd+k),ds=ymd(dt),l=per[ds]||[];
    const dots=l.slice(0,3).map(t=>`<i class="${t.type==='i'?'g':''}"></i>`).join('');
    cells+=`<div class="d ${ds.slice(0,7)!==ui.month?'o':''} ${l.length?'has':''} ${isHol(ds)?'hol':''} ${ds===today()?'today':''} ${ds===ui.sel?'sel':''}" data-act="selday" data-d="${ds}"><span class="n">${ds===today()?'今天':dt.getDate()}</span><div class="dots">${dots}</div></div>`;
  }
  const dl=bookTx().filter(t=>t.date===ui.sel).sort((a,b)=>(b.ts||0)-(a.ts||0));
  let de=0,di=0;dl.forEach(t=>{if(t.type==='e')de+=t.amt;else if(t.type==='i')di+=t.amt;else de+=t.fee||0;});
  return `<div class="wk">${W.map(w=>`<span>週${w}</span>`).join('')}</div><div class="cal">${cells}</div>`
    +`<div class="sb">支出:${money(de)}${di?'　收入:'+money(di):''}</div>`+(dl.map(row).join('')||'<div class="emp">沒有記錄。按［+］新增記錄。</div>');
}
function home(){
  const searching=ui.q.trim()!=='';
  const top=`<header class="top"><button class="ib" data-act="bookpick">${IC.book}</button><button class="ib" data-act="budget">${IC.batt}</button><div class="seg2"><button class="${ui.view==='cal'?'on':''}" data-act="view" data-v="cal">行事曆</button><button class="${ui.view==='list'?'on':''}" data-act="view" data-v="list">清單</button></div><button class="ib" data-act="qtoggle">${IC.search}</button><button class="ib" data-act="summary">${IC.expand}</button></header>`;
  const sbox=ui.qOn?`<div class="srch"><input id="q" placeholder="搜尋備註、分類、成員、標籤…" value="${esc(ui.q)}"></div>`:'';
  if(searching)return top+sbox+listBody(true);
  const mt=`<div class="mt"><button data-act="mprev">‹</button><button class="mtt" data-act="pickmonth">${mLabel(ui.month)}<small>▼</small></button><button data-act="mnext">›</button></div>`;
  if(ui.view==='cal')return top+sbox+mt+calView();
  const {e,i}=sum(ui.month,S.cur),bd=budOf('m',ui.month);
  let bh='';
  if(bd&&bd.total>0){const p=e/bd.total;bh=`<div class="bud"><small>本月預算 ${money(e)} / ${money(bd.total)}　剩餘 ${money(bd.total-e)}</small><div class="bar ${p>1?'over':''}"><i style="width:${Math.min(100,p*100)}%"></i></div></div>`;}
  return top+sbox+mt+`<div class="sumcard"><div><small>支出</small><b class="e">${money(e)}</b></div><div><small>收入</small><b class="i">${money(i)}</b></div><div><small>結餘</small><b>${money(i-e)}</b></div>${bh}</div>`+listBody(false);
}

/* ---------- 報表 ---------- */
function pie(data){
  const tot=data.reduce((a,b)=>a+b.val,0);
  if(!tot)return '<div class="empty" style="padding:30px">本月沒有資料</div>';
  let a0=-Math.PI/2,p='';const R=90,cx=100,cy=100;
  data.forEach(d=>{
    const a=d.val/tot*2*Math.PI;
    if(data.length===1){p+=`<circle cx="100" cy="100" r="${R}" fill="${d.color}"/>`;return;}
    const a1=a0+a;
    p+=`<path d="M${cx} ${cy}L${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)}A${R} ${R} 0 ${a>Math.PI?1:0} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}Z" fill="${d.color}"/>`;a0=a1;
  });
  return `<svg viewBox="0 0 200 200" class="pie">${p}<circle cx="100" cy="100" r="48" fill="var(--card)"/></svg>`;
}
function bars(rows){
  const max=Math.max(1,...rows.flatMap(r=>[r.a,r.b])),H=110,W2=320,gw=W2/rows.length;
  let s='';
  rows.forEach((r,k)=>{
    const x=k*gw+gw/2,ha=r.a/max*H,hb=r.b/max*H;
    s+=`<rect x="${x-14}" y="${H-ha+4}" width="12" height="${ha}" rx="2" fill="var(--inc)"/><rect x="${x+2}" y="${H-hb+4}" width="12" height="${hb}" rx="2" fill="var(--exp)"/><text x="${x}" y="${H+20}" font-size="11" text-anchor="middle" fill="var(--sub)">${r.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W2} ${H+28}" style="width:100%">${s}</svg>`;
}
function line(pts,labels){
  const mn=Math.min(...pts),mx=Math.max(...pts),rg=(mx-mn)||1,W2=320,H=100;
  const xy=pts.map((v,k)=>[20+k*(W2-40)/(pts.length-1||1),H-(v-mn)/rg*(H-20)+8]);
  return `<svg viewBox="0 0 ${W2} ${H+28}" style="width:100%"><polyline points="${xy.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--pri)" stroke-width="3"/>${xy.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--pri)"/><text x="${p[0]}" y="${H+22}" font-size="11" text-anchor="middle" fill="var(--sub)">${labels[k]}</text><text x="${p[0]}" y="${p[1]-8}" font-size="10" text-anchor="middle" fill="var(--tx)">${money(pts[k])}</text>`).join('')}</svg>`;
}
function rep(){
  const tp=ui.rtype,map={};
  bookTx().filter(t=>t.date.startsWith(ui.month)).forEach(t=>{
    if(tp==='e'){
      if(t.type==='e')map[t.cat||'_']=(map[t.cat||'_']||0)+t.amt;
      else if(t.type==='t'&&t.fee)map['_fee']=(map['_fee']||0)+t.fee;
    }else if(t.type==='i')map[t.cat||'_']=(map[t.cat||'_']||0)+t.amt;
  });
  const ent=Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const tot=ent.reduce((a,b)=>a+b[1],0);
  const data=ent.map(([id,val],k)=>{
    const c=id==='_fee'?{name:'轉帳手續費',icon:'🔁'}:(S.cats[tp].find(x=>x.id===id)||{name:'未分類',icon:'❓'});
    return {id,val,label:c.icon+' '+c.name,color:PAL[k%PAL.length]};
  });
  const rows=[];
  for(let k=5;k>=0;k--){const m=mShift(ui.month,-k),s=sum(m,S.cur);rows.push({label:(+m.slice(5))+'月',a:s.i,b:s.e});}
  const nl=[],np=[];
  for(let k=5;k>=0;k--){
    const m=mShift(ui.month,-k);
    np.push(netSum(m+'-31'));nl.push((+m.slice(5))+'月');
  }
  const bd=budOf('m',ui.month);
  let bh='';
  if(tp==='e'&&bd&&bd.cats&&Object.keys(bd.cats).some(k=>bd.cats[k]>0)){
    bh='<div class="card"><h3>分類預算</h3>'+S.cats.e.filter(c=>bd.cats[c.id]>0).map(c=>{

function budOf(mode,key){
  const B0=S.budgets[S.cur]||{};
  const store=(mode==='m'?B0.months:B0.years)||{};
  const k=Object.keys(store).filter(x=>x<=key).sort().pop();
  if(k)return {total:store[k].total||0,cats:store[k].cats||{}};
  return mode==='m'?{total:B0.total||0,cats:B0.cats||{}}:{total:0,cats:{}};
}
function budSet(mode,key,fn){
  const B0=S.budgets[S.cur]||(S.budgets[S.cur]={total:0,cats:{}});
  const store=mode==='m'?(B0.months=B0.months||{}):(B0.years=B0.years||{});
  const cur=budOf(mode,key),nb={total:cur.total,cats:Object.assign({},cur.cats)};
  fn(nb);store[key]=nb;save();
}

const netSum=up=>{const b=balances(up);return S.accounts.reduce((s,a)=>a.noNet?s:s+(b[a.id]||0),0);};
function accEv(aid){
  const a=S.accounts.find(x=>x.id===aid);let bal=+a.init||0;const ev=[];
  S.tx.filter(t=>t.acc===aid||t.to===aid).sort((x,y)=>x.date.localeCompare(y.date)||(x.ts||0)-(y.ts||0)).forEach(t=>{

function aSum(a){

  const g={};ev.forEach(e=>{const k=AP.grain==='y'?e.t.date.slice(0,4):e.t.date.slice(0,7);const o=g[k]||(g[k]={x:0,tr:0,bal:0});o.x+=e.inc-e.exp;o.tr+=e.tin-e.tout;o.bal=e.bal;});

/* ---------- 固定收支／固定轉帳 ---------- */
const RULES={d:{u:'d',k:1},wd:{u:'wd'},w:{u:'d',k:7},w2:{u:'d',k:14},m:{u:'m',k:1},m2:{u:'m',k:2},q:{u:'m',k:3},m4:{u:'m',k:4},m5:{u:'m',k:5},h:{u:'m',k:6},y:{u:'m',k:12},y2:{u:'m',k:24}};
const ADJ={none:'不調整',before:'提前',after:'順延'};
function dAdd(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function mAdd(ds,n){const [y,m,d]=ds.split('-').map(Number);const t=new Date(y,m-1+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return ymd(t);}
const isWkend=ds=>{const g=new Date(ds+'T00:00:00').getDay();return g===0||g===6;};
const isOff=ds=>isWkend(ds)||isHol(ds);
const fmtD=ds=>{const d=new Date(ds+'T00:00:00');return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日週'+W[d.getDay()];};
function recOcc(r,n){
  const R=RULES[r.rule]||RULES.m;let ds;
  if(R.u==='d')ds=dAdd(r.start,n*R.k);
  else if(R.u==='m')ds=mAdd(r.start,n*R.k);
  else{let d=r.start;while(isWkend(d))d=dAdd(d,1);for(let i=0;i<n;i++){d=dAdd(d,1);while(isWkend(d))d=dAdd(d,1);}ds=d;}
  if(r.byCount){if(n>=r.count)return null;}else if(r.end&&ds>r.end)return null;
  return ds;
}
function recAdj(r,ds){
  if(r.adj==='before'){for(let i=0;i<14&&isOff(ds);i++)ds=dAdd(ds,-1);}
  else if(r.adj==='after'){for(let i=0;i<14&&isOff(ds);i++)ds=dAdd(ds,1);}
  return ds;
}
function recSched(r){const occ=[];for(let n=0;n<600;n++){const o=recOcc(r,n);if(o===null)break;occ.push(recAdj(r,o));}return occ;}
function migrateRec(r){
  if(r.rule!==undefined)return;
  r.rule=r.freq||'m';r.start=r.next||today();r.n=0;r.name=r.name||r.note||'';r.member=r.member||'';r.tags=r.tags||[];
  r.end='';r.byCount=false;r.count=0;r.adj='none';r.fee=r.fee||0;

function runRecurring(){

  S.recurring.forEach(r=>{
    migrateRec(r);
    for(let g=0;g<800;g++){
      const o=recOcc(r,r.n);if(o===null)break;
      const d=recAdj(r,o);if(d>lim)break;
      S.tx.push({id:uid(),ts:Date.now()+g,book:r.book,type:r.type,amt:r.amt,cat:r.cat||'',acc:r.acc,to:r.to||'',fee:r.fee||0,date:d,note:r.name||'固定收支',member:r.member||'',tags:[...(r.tags||[])],auto:1,rid:r.id});
      r.n++;ch=true;
    }

  if(ch)save();
}

    rule:r?r.rule:'m',byCount:!!(r&&r.byCount),count:r?r.count||0:0,start:r?r.start:dAdd(today(),1),end:r?r.end||'':'',adj:r?r.adj||'none':'none',
    page:'main',kp:false,kt:'amt',q:'',ph:[],delPh:[],note:'',date:today()};

function recMain(){
  const t=F.type==='t',c=S.cats[F.type]?.find(x=>x.id===F.cat);
  const row=(ic,label,val,p)=>`<div class="pr" data-p="${p}"><span class="pi">${ic}</span><span class="pl">${label}</span><span class="pv">${val}</span><span class="chv">›</span></div>`;
  const lbl=(label,val,p)=>`<div class="pr" data-p="${p}"><span class="pl">${label}</span><span class="pv">${val}</span><span class="chv">›</span></div>`;
  const amtRow=(ic,label,id,key,p)=>`<div class="pr" data-p="${p}"><span class="pi">${ic}</span><span class="pl">${label}</span><span class="pv ${F[key]?'':'ph'}" id="${id}">${F[key]?fmtAmt(F[key]):(key==='fee'?'0':'輸入金額')}</span></div>`;
  const ro={rule:F.rule,start:F.start,end:F.byCount?'':F.end,byCount:!!F.byCount,count:+F.count||0,adj:F.adj};
  const occ=ro.start?recSched(ro):[],lim=dAdd(today(),+(S.set.ahead||0)),inf=!ro.byCount&&!ro.end;
  const done=occ.filter(d=>d<=lim).length,amt=calc(F.amt)||0,nx=occ[done],nx2=occ[done+1];
  let sch='自動產生排程\n下回　:'+(nx?fmtD(nx):'無')+'\n下下回:'+(nx2?fmtD(nx2):'無');

const isOp=c=>'+-×÷−'.includes(c);

function calc(s){
  s=String(s||'').replace(/[+\-×÷−.]+$/,'');if(!s)return 0;
  const tk=s.match(/\d+\.?\d*|\.\d+|[+\-×÷−]/g)||[];const out=[+tk[0]||0];
  for(let i=1;i+1<tk.length;i+=2){const o=tk[i],n=+tk[i+1];
    if(o==='×')out[out.length-1]*=n;else if(o==='÷'){if(n)out[out.length-1]/=n;}else out.push(o==='+'?n:-n);}
  return Math.round(out.reduce((a,b)=>a+b,0)*100)/100;
}

function kapply(s,k){
  if(k==='⌫')return s.slice(0,-1);
  if(isOp(k)){if(!s)return s;return isOp(s.slice(-1))?s.slice(0,-1)+k:s+k;}

}

function budgetLeft(){

    +H('帳本與外觀')+R('帳本管理','books',S.books.length+' 本')+R('主題色','theme')+R('密碼鎖','pin',S.set.pin?'已啟用':'未設定')

function listSheet(title,items,onAdd,onEdit,onDel,addLabel){
  const draw=()=>sheet(`<h3>${title}</h3>`+items().map(i=>`<div class="li"><span data-k="e" data-id="${i.id}" style="flex:1">${esc(i.label)}</span>${i.nodel?'':`<button data-k="d" data-id="${i.id}">刪除</button>`}</div>`).join('')+`<button class="btn" data-k="a">＋ ${addLabel||'新增'}</button><button class="btn ghost" data-k="x">完成</button>`,el=>{
    el.onclick=e=>{const k=e.target.dataset.k,id=e.target.dataset.id;
      if(k==='x')closeSheet();else if(k==='a'){onAdd();draw();render();}else if(k==='e'){onEdit(id);draw();render();}else if(k==='d'){onDel(id);draw();render();}};
  });
  draw();
}

/* ---------- 密碼鎖 ---------- */
async function sha(s){
  if(!(window.crypto&&crypto.subtle))return 'p:'+s;
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mdj'+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function lock(){if(S.set.pin){$('#lock').classList.add('on');$('#pin').value='';}}
async function tryUnlock(){
  const v=$('#pin').value;if(!v)return;
  if(await sha(v)===S.set.pin){$('#lock').classList.remove('on');$('#pin').value='';}
  else if(v.length>=8){$('#pin').value='';}
}
$('#pinOk').onclick=async()=>{const v=$('#pin').value;if(await sha(v)===S.set.pin){$('#lock').classList.remove('on');$('#pin').value='';}else{alert('密碼錯誤');$('#pin').value='';}};
$('#pin').oninput=tryUnlock;
let hiddenAt=0;

  if(document.hidden)hiddenAt=Date.now();
  else{if(hiddenAt&&Date.now()-hiddenAt>30000)lock();runRecurring();render();}
});
