<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="天天記帳">
<meta name="theme-color" content="#FF9F0A">
<title>天天記帳 私人版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--accent:#FF9F0A;--bg:#FFF8F0;--card:#FFFFFF;--text:#1A1A1A;--muted:#8E8E93;--border:#F0E6D8;--expense:#FF3B30;--income:#34C759;--shadow:0 8px 24px rgba(255,159,10,0.12)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);padding-bottom:100px;-webkit-tap-highlight-color:transparent}
.header{position:sticky;top:0;z-index:10;background:rgba(255,248,240,0.9);backdrop-filter:blur(20px);padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:1px solid var(--border)}
.header-top{display:flex;justify-content:space-between;align-items:center}
.month-nav{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:700}
.month-nav button{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--card);font-size:16px}
.summary{display:flex;gap:12px;margin-top:12px}
.sum-card{flex:1;background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.sum-card .label{font-size:11px;color:var(--muted)} .sum-card .val{font-size:14px;font-weight:700;margin-top:2px}
.sum-card.expense .val{color:var(--expense)} .sum-card.income .val{color:var(--income)}
.calendar{background:var(--card);margin:12px 16px;border-radius:20px;padding:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);padding:6px 0}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.day{aspect-ratio:0.9; border-radius:12px; padding:6px 4px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; position:relative; cursor:pointer}
.day.today{background:var(--bg);border:1px solid var(--accent)}
.day.selected{background:var(--accent);color:white}
.day.selected .d-expense,.day.selected .d-income{color:white}
.day-num{font-size:14px;font-weight:600}
.d-expense{font-size:8px;color:var(--expense);margin-top:2px;line-height:1}
.d-income{font-size:8px;color:var(--income);line-height:1}
.day.other{opacity:0.3}
.list-section{margin:16px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;font-weight:700}
.tx-list{display:flex;flex-direction:column;gap:10px}
.tx-item{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.04);border:1px solid var(--border)}
.tx-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-cat{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-note{font-size:11px;color:var(--muted);margin-top:2px}
.tx-right{text-align:right}
.tx-amount{font-size:15px;font-weight:700}
.tx-account{font-size:10px;color:var(--muted)}
.fab{position:fixed;bottom:calc(75px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--accent);color:white;border:none;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:700;box-shadow:0 8px 20px rgba(255,159,10,0.4);display:flex;align-items:center;gap:8px;z-index:30}
body{padding-bottom:120px}
.nav{z-index:20}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,0.9);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));z-index:15}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);background:none;border:none;padding:6px}
.nav-item.active{color:var(--accent)}
.nav-item .ico{font-size:20px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:flex-end}
.modal-overlay.show{display:flex}
.modal{background:var(--card);width:100%;max-height:92vh;border-radius:24px 24px 0 0;padding:0 0 env(safe-area-inset-bottom);overflow:auto;animation:slideUp 0.3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{position:sticky;top:0;background:var(--card);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);z-index:2}
.type-switch{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.type-btn{padding:8px 18px;border-radius:9px;border:none;font-size:14px;font-weight:600;background:transparent;color:var(--muted)}
.type-btn.active{background:var(--card);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,0.08)}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px 20px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:2px solid transparent;background:var(--bg);cursor:pointer}
.cat-item.selected{border-color:var(--accent);background:#FFF3E0}
.cat-emoji{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.amount-box{margin:12px 20px;background:var(--bg);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.amount-display{font-size:32px;font-weight:800;letter-spacing:-1px}
.numpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 20px 12px}
.np-btn{height:52px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:20px;font-weight:600}
.np-btn.accent{background:var(--accent);color:white;border-color:var(--accent)}
.pills{display:flex;gap:8px;overflow:auto;padding:0 20px 12px}
.pill{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);white-space:nowrap;font-size:13px}
.pill.selected{background:var(--accent);color:white;border-color:var(--accent)}
.input-row{display:flex;gap:10px;padding:0 20px 12px}
.input-row input, .input-row select{flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);font-size:14px}
.save-btn{margin:12px 20px 20px;width:calc(100% - 40px);padding:16px;background:var(--accent);color:white;border:none;border-radius:16px;font-size:16px;font-weight:700}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:12px}

/* 隱藏 Netlify 浮水印，修復按鈕被遮住 */
#netlify-badge, [data-testid="netlify-badge"], div[style*="Powered by Netlify"], a[href*="netlify.com"] {display:none !important}
div[class*="netlify-badge"], iframe[src*="netlify"] {display:none !important}
/* Netlify 注入的右下角黑條 */
body > div[style*="position: fixed"][style*="bottom"]{pointer-events:none}
body > div[style*="position: fixed"][style*="bottom"] a{display:none !important}

</style>
<link rel="manifest" href="./manifest.json">
</head>
<body>
<div class="header">
  <div class="header-top">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <span id="monthLabel">2026年10月</span>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div style="font-size:12px;color:var(--muted)">私人版·本機</div>
  </div>
  <div class="summary">
    <div class="sum-card expense"><div class="label">本月支出</div><div class="val" id="sumExpense">NT$ 0</div></div>
    <div class="sum-card income"><div class="label">本月收入</div><div class="val" id="sumIncome">NT$ 0</div></div>
    <div class="sum-card"><div class="label">結餘</div><div class="val" id="sumNet">NT$ 0</div></div>
  </div>
</div>

<div class="calendar">
  <div class="weekdays"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
  <div class="days" id="daysGrid"></div>
</div>

<div class="list-section">
  <div class="section-title"><span id="selectedDateLabel">今天</span><span id="dayTotal" style="color:var(--muted);font-weight:400"></span></div>
  <div class="tx-list" id="txList"></div>
</div>

<button class="fab" onclick="openModal()">＋ 記一筆</button>

<div class="nav">
  <button class="nav-item active"><span class="ico">📅</span>明細</button>
  <button class="nav-item" onclick="alert('統計功能在完整版，明細頁已包含本月圓餅圖。去設定頁可看匯出')"><span class="ico">📊</span>統計</button>
  <button class="nav-item" onclick="alert('帳戶：現金 NT$'+(accounts[0]?.balance||0)+'\n銀行 NT$'+(accounts[1]?.balance||0))"><span class="ico">💳</span>帳戶</button>
  <button class="nav-item" onclick="openSettings()"><span class="ico">⚙️</span>設定</button>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target==this)closeModal()">
  <div class="modal">
    <div class="modal-header">
      <button onclick="closeModal()" style="border:none;background:none;font-size:16px">取消</button>
      <div style="font-weight:700">記一筆</div>
      <button onclick="saveTx()" style="border:none;background:none;color:var(--accent);font-weight:700;font-size:16px">儲存</button>
    </div>
    <div class="type-switch" style="margin:16px 20px">
      <button class="type-btn active" id="btnExpense" onclick="setType('expense')">支出</button>
      <button class="type-btn" id="btnIncome" onclick="setType('income')">收入</button>
      <button class="type-btn" id="btnTransfer" onclick="setType('transfer')">轉帳</button>
    </div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="amount-box">
      <span style="color:var(--muted)">NT$</span>
      <span class="amount-display" id="amountDisplay">0</span>
    </div>
    <div class="numpad">
      <button class="np-btn" onclick="pressNum('1')">1</button>
      <button class="np-btn" onclick="pressNum('2')">2</button>
      <button class="np-btn" onclick="pressNum('3')">3</button>
      <button class="np-btn" onclick="pressDel()">⌫</button>
      <button class="np-btn" onclick="pressNum('4')">4</button>
      <button class="np-btn" onclick="pressNum('5')">5</button>
      <button class="np-btn" onclick="pressNum('6')">6</button>
      <button class="np-btn" onclick="pressNum('0')">0</button>
      <button class="np-btn" onclick="pressNum('7')">7</button>
      <button class="np-btn" onclick="pressNum('8')">8</button>
      <button class="np-btn" onclick="pressNum('9')">9</button>
      <button class="np-btn" onclick="pressNum('.')">.</button>
    </div>
    <div style="padding:0 20px 8px;font-size:12px;color:var(--muted)">帳戶</div>
    <div class="pills" id="accountPills"></div>
    <div id="transferRow" style="display:none;padding:0 20px 12px"><div style="font-size:12px;color:var(--muted);margin-bottom:6px">轉入到</div><div class="pills" id="toAccountPills"></div></div>
    <div class="input-row">
      <input type="date" id="txDate">
      <input type="text" id="txNote" placeholder="備註...">
    </div>
    <button class="save-btn" onclick="saveTx()">儲存</button>
  </div>
</div>

<script>
const CATS={
 expense:[
  {id:'food',name:'餐飲',emoji:'🍜',color:'#FF9F0A'},
  {id:'transport',name:'交通',emoji:'🚌',color:'#5856D6'},
  {id:'shopping',name:'購物',emoji:'🛍️',color:'#FF2D55'},
  {id:'house',name:'住房',emoji:'🏠',color:'#007AFF'},
  {id:'ent',name:'娛樂',emoji:'🎮',color:'#AF52DE'},
  {id:'medical',name:'醫療',emoji:'💊',color:'#FF3B30'},
  {id:'edu',name:'教育',emoji:'📚',color:'#34C759'},
  {id:'daily',name:'日用',emoji:'🧻',color:'#8E8E93'},
  {id:'gift',name:'紅包',emoji:'🧧',color:'#FF3B30'},
  {id:'other',name:'其他',emoji:'📦',color:'#8E8E93'},
 ],
 income:[
  {id:'salary',name:'薪資',emoji:'💼',color:'#34C759'},
  {id:'bonus',name:'獎金',emoji:'🎁',color:'#FF9F0A'},
  {id:'invest',name:'投資',emoji:'📈',color:'#007AFF'},
  {id:'part',name:'兼職',emoji:'💻',color:'#5856D6'},
  {id:'refund',name:'退款',emoji:'↩️',color:'#8E8E93'},
 ]
};
let accounts=JSON.parse(localStorage.getItem('pw_accounts')||'null')||[
 {id:'cash',name:'現金',type:'cash',balance:5000,icon:'💵'},
 {id:'bank',name:'銀行',type:'bank',balance:30000,icon:'🏦'},
 {id:'credit',name:'信用卡',type:'credit',balance:-2000,icon:'💳'},
 {id:'easy',name:'悠遊卡',type:'easycard',balance:300,icon:'🚇'},
];
let transactions=JSON.parse(localStorage.getItem('pw_txs')||'null')||[
 {id:'1',type:'expense',category:'food',account:'cash',amount:120,date:todayStr(),note:'午餐'},
 {id:'2',type:'expense',category:'transport',account:'easy',amount:35,date:todayStr(),note:'捷運'},
 {id:'3',type:'income',category:'salary',account:'bank',amount:40000,date:todayStr(),note:'10月薪水'},
];
let curMonth=new Date(); curMonth.setDate(1);
let selectedDate=todayStr();
let curType='expense', curCat='food', curAccount='cash', toAccount='bank', amountStr='0', editingId=null;

function todayStr(){return new Date().toISOString().slice(0,10)}
function save(){
 localStorage.setItem('pw_accounts',JSON.stringify(accounts));
 localStorage.setItem('pw_txs',JSON.stringify(transactions));
}
function fmt(n){return 'NT$ '+Number(n).toLocaleString()}
function changeMonth(d){curMonth.setMonth(curMonth.getMonth()+d);render()}
function render(){
 document.getElementById('monthLabel').textContent=curMonth.getFullYear()+'年'+(curMonth.getMonth()+1)+'月';
 let y=curMonth.getFullYear(), m=curMonth.getMonth();
 let first=new Date(y,m,1); let startDay=(first.getDay()+6)%7;
 let daysInMonth=new Date(y,m+1,0).getDate();
 let prevDays=new Date(y,m,0).getDate();
 let html=''; let dayList=[];
 for(let i=0;i<startDay;i++){let d=prevDays-startDay+1+i; html+=`<div class="day other"><div class="day-num">${d}</div></div>`}
 for(let d=1;d<=daysInMonth;d++){
  let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  let dayTxs=transactions.filter(t=>t.date===ds);
  let e=dayTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  let inc=dayTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  let isToday=ds===todayStr(); let isSel=ds===selectedDate;
  html+=`<div class="day ${isToday?'today':''} ${isSel?'selected':''}" onclick="selectDate('${ds}')"><div class="day-num">${d}</div>${e?`<div class="d-expense">-${e}</div>`:''}${inc?`<div class="d-income">+${inc}</div>`:''}</div>`;
 }
 let totalCells=startDay+daysInMonth; let remain= (7 - totalCells%7)%7;
 for(let i=1;i<=remain;i++){html+=`<div class="day other"><div class="day-num">${i}</div></div>`}
 document.getElementById('daysGrid').innerHTML=html;
 // summary
 let monthTxs=transactions.filter(t=>{let dd=new Date(t.date);return dd.getFullYear()==y&&dd.getMonth()==m});
 let me=monthTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
 let mi=monthTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
 document.getElementById('sumExpense').textContent=fmt(me);
 document.getElementById('sumIncome').textContent=fmt(mi);
 document.getElementById('sumNet').textContent=fmt(mi-me);
 renderTxList();
}
function selectDate(ds){selectedDate=ds;render()}
function renderTxList(){
 let list=document.getElementById('txList');
 let dayTxs=transactions.filter(t=>t.date===selectedDate).sort((a,b)=>b.id.localeCompare(a.id));
 document.getElementById('selectedDateLabel').textContent=selectedDate===todayStr()?'今天':selectedDate;
 let total=dayTxs.reduce((s,t)=> t.type==='expense'?s-t.amount : t.type==='income'?s+t.amount : s,0);
 document.getElementById('dayTotal').textContent= dayTxs.length? (total>=0?'+'+total:total) : '';
 if(!dayTxs.length){list.innerHTML='<div class="empty"><div class="big">🪙</div>還沒有記帳<br>點下方橘色按鈕開始</div>';return}
 let h='';
 for(let t of dayTxs){
  let cat=(CATS[t.type==='transfer'?'expense':t.type]||CATS.expense).find(c=>c.id===t.category)||CATS.expense[0];
  let acc=accounts.find(a=>a.id===t.account);
  let amt=t.type==='expense'?'-'+t.amount : t.type==='income'?'+'+t.amount : t.amount;
  let color=t.type==='expense'?'var(--expense)':t.type==='income'?'var(--income)':'var(--text)';
  h+=`<div class="tx-item" onclick="editTx('${t.id}')"><div class="tx-icon" style="background:${cat.color}20">${cat.emoji}</div><div class="tx-info"><div class="tx-cat">${t.type==='transfer'?'轉帳':cat.name}</div><div class="tx-note">${t.note||''} · ${acc?acc.name:''}${t.toAccount?' → '+accounts.find(a=>a.id===t.toAccount)?.name:''}</div></div><div class="tx-right"><div class="tx-amount" style="color:${color}">${t.type==='transfer'?'':(t.type==='expense'?'-':'+')}${fmt(t.amount).replace('NT$ ','')}</div><div class="tx-account">${t.date}</div></div></div>`;
 }
 list.innerHTML=h;
}
function openModal(){document.getElementById('modalOverlay').classList.add('show');renderCats();renderAccounts();document.getElementById('txDate').value=selectedDate;document.getElementById('amountDisplay').textContent=amountStr}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');editingId=null;amountStr='0'}
function setType(t){curType=t;document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));document.getElementById(t==='expense'?'btnExpense':t==='income'?'btnIncome':'btnTransfer').classList.add('active');document.getElementById('transferRow').style.display=t==='transfer'?'block':'none';renderCats()}
function renderCats(){
 let cats=curType==='transfer'?CATS.expense:CATS[curType];let h='';
 for(let c of cats){h+=`<div class="cat-item ${curCat===c.id?'selected':''}" onclick="selectCat('${c.id}')"><div class="cat-emoji" style="background:${c.color}20">${c.emoji}</div><div style="font-size:12px">${c.name}</div></div>`}
 document.getElementById('catGrid').innerHTML=h;
}
function selectCat(id){curCat=id;renderCats()}
function renderAccounts(){
 let h='';for(let a of accounts){h+=`<button class="pill ${curAccount===a.id?'selected':''}" onclick="curAccount='${a.id}';renderAccounts()">${a.icon} ${a.name} ${a.balance}</button>`}
 document.getElementById('accountPills').innerHTML=h;
 let h2='';for(let a of accounts){h2+=`<button class="pill ${toAccount===a.id?'selected':''}" onclick="toAccount='${a.id}';renderAccounts()">${a.icon} ${a.name}</button>`}
 document.getElementById('toAccountPills').innerHTML=h2;
}
function pressNum(k){
 if(k==='.'){if(amountStr.includes('.'))return;amountStr+='.'}
 else{if(amountStr==='0')amountStr=k;else amountStr+=k}
 document.getElementById('amountDisplay').textContent=amountStr;
}
function pressDel(){amountStr=amountStr.slice(0,-1)||'0';document.getElementById('amountDisplay').textContent=amountStr}
function saveTx(){
 let amt=parseFloat(amountStr);if(!amt||amt<=0){alert('請輸入金額');return}
 let date=document.getElementById('txDate').value||selectedDate;
 let note=document.getElementById('txNote').value;
 let tx={id:editingId||Date.now().toString(),type:curType,category:curCat,account:curAccount,toAccount:curType==='transfer'?toAccount:null,amount:amt,date,note};
 if(editingId){let idx=transactions.findIndex(t=>t.id===editingId);transactions[idx]=tx}else{transactions.push(tx)}
 // update balances simple
 if(curType==='expense'){let a=accounts.find(x=>x.id===curAccount);if(a)a.balance-=amt}
 if(curType==='income'){let a=accounts.find(x=>x.id===curAccount);if(a)a.balance+=amt}
 if(curType==='transfer'){let a=accounts.find(x=>x.id===curAccount);let b=accounts.find(x=>x.id===toAccount);if(a)a.balance-=amt;if(b)b.balance+=amt}
 save();closeModal();amountStr='0';document.getElementById('txNote').value='';render();
 try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}
}
function editTx(id){
 let t=transactions.find(x=>x.id===id);if(!t)return;
 editingId=id;curType=t.type;curCat=t.category;curAccount=t.account;toAccount=t.toAccount||'bank';amountStr=String(t.amount);selectedDate=t.date;document.getElementById('txNote').value=t.note||'';openModal();setType(curType);
}
function openSettings(){
 let json=JSON.stringify({transactions,accounts},null,2);
 let w=window.open();w.document.write('<pre>'+json+'</pre><br><button onclick="localStorage.clear();alert(\'已清除\');location.reload()">清除所有資料</button> ');
}
render();
</script>

<!-- 自動更新 PWA 邏輯 - 官網一改，桌面版自動更新 -->
<style>
#updateBanner{position:fixed;top:env(safe-area-inset-top,0);left:12px;right:12px;background:#1A1A1A;color:white;border-radius:16px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
#updateBanner.show{display:flex}
#updateBanner button{background:#FF9F0A;color:white;border:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px}

/* 隱藏 Netlify 浮水印，修復按鈕被遮住 */
#netlify-badge, [data-testid="netlify-badge"], div[style*="Powered by Netlify"], a[href*="netlify.com"] {display:none !important}
div[class*="netlify-badge"], iframe[src*="netlify"] {display:none !important}
/* Netlify 注入的右下角黑條 */
body > div[style*="position: fixed"][style*="bottom"]{pointer-events:none}
body > div[style*="position: fixed"][style*="bottom"] a{display:none !important}

</style>
<div id="updateBanner"><span>🎉 發現新版，官網已更新</span><button onclick="applyUpdate()">立即更新</button></div>
<script>
// 註冊 SW
let newWorker = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    console.log('[PWA] SW registered', reg.scope);
    
    // 每小時檢查一次官網有沒有新版
    setInterval(() => {
      reg.update();
      checkVersionJson();
    }, 3600000);

    reg.addEventListener('updatefound', () => {
      newWorker = reg.installing;
      console.log('[PWA] 發現新版 SW');
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          // 有新版，顯示 banner
          document.getElementById('updateBanner').classList.add('show');
          // 如果想無感自動更新，取消註解下一行
          // applyUpdate();
        }
      });
    });
  });

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    console.log('[PWA] 新版已接管，重整');
    window.location.reload();
  });
}

function applyUpdate() {
  if (newWorker) {
    newWorker.postMessage('SKIP_WAITING');
  } else {
    // 沒有 SW 就直接清快取重整
    if ('caches' in window) {
      caches.keys().then(k => k.forEach(cache => caches.delete(cache)));
    }
    window.location.reload(true);
  }
}

// 額外透過 version.json 檢查（更即時）
async function checkVersionJson() {
  try {
    const res = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
    const data = await res.json();
    const localVer = localStorage.getItem('pwa_version') || '1.0.0';
    if (data.version !== localVer) {
      console.log('[PWA] version.json 發現新版', data.version, 'local', localVer);
      localStorage.setItem('pwa_version', data.version);
      if (localVer !== '1.0.0') {
        document.getElementById('updateBanner').classList.add('show');
      } else {
        localStorage.setItem('pwa_version', data.version);
      }
    }
  } catch(e) {}
}
checkVersionJson();

// 首次安裝記錄版號
if (!localStorage.getItem('pwa_version')) {
  fetch('./version.json').then(r=>r.json()).then(d=>localStorage.setItem('pwa_version', d.version)).catch(()=>{});
}
</script>


<script>
// 自動移除 Netlify 的 Powered by Netlify 浮水印
setInterval(()=>{
  document.querySelectorAll('div, a, iframe').forEach(el=>{
    if(el.textContent && el.textContent.includes('Powered by Netlify')){
      let p = el;
      // 找到最外層 fixed 的容器刪掉
      while(p && p.parentElement){
        const style = window.getComputedStyle(p);
        if(style.position === 'fixed' && (p.textContent.includes('Powered by Netlify'))){
          p.style.display='none';
          break;
        }
        if(p.tagName==='BODY') break;
        p = p.parentElement;
      }
      // 如果本身就是 badge
      if(el.style && el.style.position==='fixed') el.style.display='none';
    }
  });
}, 1000);
</script>

</body>
</html>
