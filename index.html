<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日記帳">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>每日記帳</title>
<style>
:root{--pri:#4caf8f;--bg:#000;--card:#1c1c1e;--tx:#fff;--sub:#8e8e93;--line:#2a2a2c;--exp:#e5594f;--inc:#6fae72;--dim:#141414;--safe-b:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#f3f5f4;--card:#fff;--tx:#222;--sub:#8a9490;--line:#e6eae8;--inc:#2f9e6e;--dim:#e9ecea}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{position:fixed;inset:0;width:100%}
#app,.hscroll,.pg-b,.sbody,.shb,#menul,.schips{overscroll-behavior:contain}
#wrap{max-width:520px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;position:relative}
#app{flex:1;min-height:0;overflow-y:auto;padding:0 0 12px}
#app.fx{overflow:hidden;padding:0;display:flex;flex-direction:column}.hfix{flex:none}.hscroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:12px}
header{background:var(--bg);color:var(--tx);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header select,header button{background:var(--line);color:var(--tx);border:0;border-radius:8px;padding:6px 10px;font-size:14px}
header.top{justify-content:space-between;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px}
header .ib{background:none;padding:6px;line-height:0}
header.top .ib svg{width:22px;height:22px}
header.top .ib:nth-of-type(3) svg{width:28px;height:28px}
header.top .ib:nth-of-type(4) svg{width:20px;height:20px}
.seg2{display:flex;border:1.5px solid var(--tx);border-radius:12px;overflow:hidden}
header .seg2 button{background:var(--bg);color:var(--tx);border-radius:0;padding:7px 19px;font-size:12.5px;line-height:1.2}
header .seg2 button.on{background:var(--tx);color:var(--bg)}
.mt{display:flex;align-items:center;justify-content:space-between;padding:4px 8px}
.mt button{background:none;border:0;color:var(--sub);font-size:34px;font-weight:200;line-height:1;padding:0 12px}
.mt .mtt{color:var(--tx);font-size:22px;font-weight:400;padding:10px 6px}.mt .mtt small{font-size:11px;margin-left:2px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:var(--sub);font-size:10px;padding:6px 0 8px;border-bottom:1px solid var(--line)}
.sb{background:var(--dim);color:var(--sub);font-size:17px;padding:9px 16px;border-bottom:1px solid var(--line)}
header select option{color:#000}
.mnav{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px;font-weight:600}
.mnav button{background:none;border:0;font-size:22px;color:var(--pri);padding:0 10px}
.sumcard{background:var(--card);margin:0 12px 10px;border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.sumcard small{color:var(--sub);display:block;font-size:12px}
.sumcard b{font-size:17px}
.e{color:var(--exp)}.i{color:var(--inc)}.t{color:var(--sub)}
.bud{grid-column:1/-1;text-align:left;margin-top:6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--pri)}
.bar.over>i{background:var(--exp)}
.dh{display:flex;justify-content:space-between;padding:8px 16px;font-size:13px;color:var(--sub)}
.row{display:flex;align-items:center;gap:10px;background:var(--bg);padding:8px 14px;border-bottom:1px solid var(--line)}
.ic{width:30px;height:30px;display:grid;place-items:center;font-size:20px;flex:none}
.mid{flex:1;min-width:0}.mid b{display:block;font-weight:500}.mid small{display:block;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:400;font-size:17px;font-variant-numeric:tabular-nums}
.row .amt.e{color:var(--tx)}.row .amt.t{color:var(--sub)}
.rt{text-align:right}.rt small{display:block;color:var(--sub);font-size:16px}
.mo{color:var(--sub);font-size:18px;padding-left:2px}
.mid b{font-size:18px;font-weight:400}.mid small{font-size:15px}
.empty{text-align:center;color:var(--sub);padding:50px 20px}
nav{display:flex;background:var(--bg);border-top:1px solid var(--line);padding-bottom:var(--safe-b);flex:none;position:relative;z-index:6}
.tab{flex:1;background:none;border:0;padding:7px 0 5px;color:var(--sub);font-size:10px}
.tab svg{display:block;margin:0 auto 3px;width:25px;height:25px}.tab.on{color:var(--tx)}
.card{background:var(--card);margin:10px 12px;border-radius:14px;padding:12px}
.card h3{margin:0 0 8px;font-size:15px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;color:var(--tx);font-size:15px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line)}
.cal .d{height:44px;border-bottom:1px solid var(--line);text-align:center;padding-top:8px}
.cal .d:nth-last-child(-n+7){border-bottom:0}
.cal .d .n{white-space:nowrap;display:inline-block;min-width:28px;line-height:24px;font-size:18px;border-radius:15px}
.cal .d.has .n{color:var(--inc)}
.cal .d.o{background:var(--dim)}.cal .d.o .n{color:var(--sub)}
.cal .d.hol .n{color:var(--exp)}
.cal .d.today .n{background:var(--exp);color:#fff;font-size:18px;padding:3px 5px;margin-top:-3px}
.cal .d.sel .n{box-shadow:0 0 0 2px var(--tx) inset}.cal .d.today.sel .n{box-shadow:none}
.dots{display:flex;gap:3px;justify-content:center;margin-top:5px;height:4px}
.dots i{width:3.5px;height:3.5px;border-radius:50%;background:var(--tx);opacity:.85}
.dots i.g{background:#4caf50;opacity:1}
.pie{width:190px;height:190px;display:block;margin:4px auto}
.leg{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.leg i{width:12px;height:12px;border-radius:3px;flex:none}.leg span{flex:1}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
.shb{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--safe-b))}
.shb h3{margin:0 0 10px}
label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
label>input,label>select{flex:1;max-width:62%;text-align:right;border:0;background:none;color:var(--tx);font-size:16px;outline:none}
.big{width:100%;font-size:34px;text-align:center;border:0;background:none;color:var(--tx);outline:none;padding:8px 0}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.cats button{border:2px solid transparent;background:var(--bg);border-radius:10px;padding:6px 0;color:var(--tx);font-size:11px}
.cats button span{display:block;font-size:22px}.cats button.on{border-color:var(--pri)}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:16px;padding:12px;margin-top:12px}
.btn.ghost{background:var(--line);color:var(--tx)}.btn.danger{background:none;color:var(--exp)}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li button{background:none;border:0;color:var(--exp)}
.mrow{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:14px 16px;border-bottom:1px solid var(--line)}
.mrow small{color:var(--sub)}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.sw button{width:42px;height:42px;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--tx)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lock.on{display:flex}#lock input{font-size:28px;text-align:center;width:180px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--tx)}
.srch{padding:8px 12px}.srch input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px}
.acc-h{padding:8px 16px;font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
#page{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);z-index:15;display:none;flex-direction:column;color:var(--tx)}
#page.on{display:flex}
.pg-h{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;border-bottom:1px solid var(--line);flex:none}
.pg-h button{background:none;border:0;color:var(--tx);font-size:16px;padding:6px 4px}
.pg-h .l{text-align:left;white-space:nowrap}.pg-h .l.x{font-size:22px;line-height:1}.pg-h .r{text-align:right;white-space:nowrap}
.pg-h h2{margin:0;font-size:17px;font-weight:500;text-align:center}
.seg3{display:flex;border:1.5px solid var(--tx);border-radius:9px;overflow:hidden;justify-self:center}
.seg3 button{padding:6px 15px;font-size:13px;line-height:1.2;border-radius:0}
.seg3 button.on{background:var(--tx);color:var(--bg)}
.pg-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pg-date{display:block;position:relative;text-align:center;font-size:19px;padding:18px 0;background:var(--dim)}
.pg-date input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.pr{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card);border-bottom:1px solid var(--line);font-size:17px}
.pr .pi{width:26px;text-align:center;font-size:19px;flex:none}
.pr .pl{flex:none}
.pr .pv{flex:1;text-align:right;min-width:0}
.pr .pv small{display:block;color:var(--sub);font-size:12px}
.pr .ph{color:var(--sub)}
.pr .chv{color:var(--sub);font-size:22px;line-height:1}
.pr.d{background:var(--dim);color:var(--sub)}
.pr.d .pl{flex:1}
.pr select{flex:1;text-align:right;text-align-last:right;background:none;border:0;color:var(--tx);font-size:17px;outline:none}
.pr .ai{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:16px;flex:none}
.blue{color:#3b82f6;font-size:20px}
.note{display:block;width:100%;min-height:130px;border:0;outline:none;resize:none;background:var(--dim);color:var(--tx);font:inherit;font-size:16px;padding:14px 16px}
.thumbs{display:flex;gap:8px;padding:10px 16px;background:var(--dim)}
.th{width:64px;height:64px;border-radius:8px;overflow:hidden;background:var(--line);display:grid;place-items:center;color:var(--sub)}
.th img{width:100%;height:100%;object-fit:cover}
.pg-foot{display:flex;gap:12px;padding:10px 12px calc(10px + var(--safe-b));flex:none;background:var(--bg)}
.pg-foot button{flex:1;border:1.5px solid var(--tx);background:none;color:var(--tx);border-radius:6px;padding:12px;font-size:16px}
.pg-foot button.dg{color:var(--exp);border-color:var(--exp)}
#page.kp-on .pg-foot{display:none}
.kp{display:none;background:var(--card);padding-bottom:var(--safe-b);flex:none}
#page.kp-on .kp{display:block}
.kp-top{display:flex;align-items:center;gap:2px;padding:0 6px;height:46px;border-bottom:1px solid var(--line)}
.kp-top button{background:none;border:0;color:var(--tx);font-size:19px;padding:8px 14px}
.kp-top .sp{flex:1}
.kp-g{display:grid;grid-template-columns:repeat(4,1fr)}
.kp-g button{height:54px;background:var(--card);border:0;border-right:.5px solid var(--line);border-bottom:.5px solid var(--line);color:var(--tx);font-size:22px}
.kp-g button.op{color:var(--sub)}
.kp-g button:active,.kp-top button:active{background:var(--line)}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px}
.cg button{position:relative;background:var(--card);border:0;color:var(--tx);height:88px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.cg button span{font-size:30px;line-height:1}
.cg button .plus{color:#4caf50;font-size:34px}
.cg .ck{position:absolute;top:6px;right:8px;width:20px;height:20px;border-radius:50%;background:#fff;color:#000;font-size:12px;line-height:20px;text-align:center;font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 4px}
.chip{border:0;border-radius:18px;padding:9px 16px;background:var(--line);color:var(--tx);font-size:15px}
.chip.on{background:var(--tx);color:var(--bg)}.chip.add{color:var(--sub)}
.emp{color:var(--sub);font-size:13px;padding:10px 14px}
#bpage{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);z-index:14;display:none;flex-direction:column;color:var(--tx)}
#bpage.on{display:flex}
.pg-h.w{grid-template-columns:1fr auto 1fr}
.pg-h.w .ic2{display:flex;justify-content:flex-end;gap:10px}
.pg-h.w .ic2 button{padding:4px;line-height:0}
.seg3.big button{padding:7px 18px;font-size:13px}
.bsum{display:flex;align-items:center;gap:22px;padding:4px 20px 14px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;display:block}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:24px}
.ring small{font-size:12px;margin:6px 0 0 1px}
.bsl{flex:1;min-width:0}
.bsl>div{display:flex;justify-content:space-between;align-items:center;font-size:19px;padding:5px 0}
.bsl b{font-weight:400}
.bsl .bv{display:flex;align-items:center;gap:14px}
.pen{background:none;border:0;color:var(--tx);padding:0;line-height:0}
.bh{display:flex;justify-content:space-between;padding:12px 14px;background:var(--dim);color:var(--sub);font-size:17px}
.br{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.br.ed{background:var(--card)}
.br .bm{flex:1;min-width:0}
.br .t1{display:flex;justify-content:space-between;align-items:center;font-size:19px}
.bamt{font-size:19px}.bamt.un{color:var(--sub)}
.bbar{height:3px;background:var(--line);margin:7px 0 5px;position:relative;border-radius:2px}
.bbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.br .t2{display:flex;justify-content:space-between;font-size:14px;color:var(--sub)}
.neg{color:var(--exp)}
.bstat{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:8px 0 calc(10px + var(--safe-b));border-top:1px solid var(--line);flex:none}
.bstat b{display:block;font-size:19px;font-weight:400}.bstat small{color:var(--sub);font-size:13px}
.bkp{background:var(--card);flex:none;padding-bottom:var(--safe-b)}
.kbar{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line)}
.kbar button{background:none;border:0;color:#3b82f6;font-size:17px}
.bedit{display:inline-flex;align-items:center;gap:6px;font-size:19px}
.caret{display:inline-block;width:2px;height:20px;background:#3b82f6}
.bedit button{background:none;border:0;color:var(--sub);font-size:18px;padding:0}
.sb2{background:var(--dim);color:var(--tx);font-size:17px;padding:10px 14px;border-bottom:1px solid var(--line)}
#apage{position:fixed;inset:0;max-width:520px;margin:0 auto;background:var(--bg);z-index:13;display:none;flex-direction:column;color:var(--tx)}
#apage.on{display:flex}
#apage .bkp{display:none}#apage.kp-on .bkp{display:block}
.i{color:var(--inc)}.z{color:var(--sub)}
.as-top{position:relative;padding:12px 14px 14px;text-align:center}
.as-top .cur{position:absolute;left:14px;top:12px;border:1px solid var(--sub);color:var(--sub);font-size:13px;padding:0 5px;border-radius:3px}
.as-top .per{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--sub);font-size:14px}
.as-top .bal{font-size:26px;padding-top:18px}
.as-top .bal small{display:block;color:var(--tx);font-size:14px;margin-top:2px}
.as-stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.as-stats b{display:block;font-size:20px;font-weight:400}.as-stats small{font-size:14px}
.as-stats.s2{border-top:0}
.gh{background:var(--dim);color:var(--sub);padding:10px 14px;font-size:16px}
.gr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.gr .gl{line-height:1.5;color:var(--sub);font-size:17px}.gr .gb2{line-height:1.5;color:var(--sub);font-size:17px;text-align:right}.gr .gb{color:var(--sub);font-size:17px}
.as-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px calc(8px + var(--safe-b));border-top:1px solid var(--line);flex:none}
.as-bar button{background:none;border:0;color:var(--tx)}
.as-bar .plus{line-height:0;padding:6px}.as-bar .draw{font-size:18px}
.seg4{display:flex;background:var(--card);border-radius:8px;padding:2px}
.seg4 button{padding:6px 22px;font-size:14px;border-radius:6px;color:var(--sub)}
.seg4 button.on{background:#48484a;color:var(--tx)}
.seg5{display:flex;background:var(--card);border-radius:8px;padding:2px;margin:6px 10px 10px}
.seg5 button{flex:1;padding:6px 0;font-size:14px;border:0;border-radius:6px;background:none;color:var(--sub)}
.seg5 button.on{background:#48484a;color:var(--tx)}
.dh2{background:var(--dim);padding:9px 14px;font-size:17px}
.dh2 small{display:block;color:var(--sub);font-size:15px;margin-top:2px}
.pin{flex:1;min-width:0;text-align:right;background:none;border:0;outline:none;color:var(--tx);font-size:17px}
.pr .pv.i{color:var(--inc)}
.tg{position:relative;width:51px;height:31px;display:inline-block;margin-left:auto}
.tg input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;z-index:1}
.tg i{position:absolute;inset:0;background:#39393d;border-radius:16px;transition:.2s}
.tg i::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+i{background:#34c759}.tg input:checked+i::after{transform:translateX(20px)}
.pr:has(.tg){justify-content:space-between}
.xr .pin{font-size:16px}.xdel{background:none;border:0;color:var(--sub);font-size:16px;padding:4px 6px}
.delrow{color:var(--exp);text-align:center;padding:14px;margin-top:14px;background:var(--card);font-size:17px}
.ip{display:grid;place-items:center;padding:18px}.ip .ai{width:64px;height:64px;font-size:32px}
.igrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:12px 14px}
.igrid button{aspect-ratio:1;border:2px solid transparent;border-radius:50%;background:var(--card);font-size:22px;display:grid;place-items:center;padding:0}
.igrid button.on{border-color:var(--tx)}
.igrid button i{width:70%;height:70%;border-radius:50%;display:block}
.acc-off>*{opacity:.45}
.swr{position:relative;overflow:hidden;background:var(--bg)}
.swr .row{position:relative;z-index:1;touch-action:pan-y;transition:transform .22s ease;border-bottom:1px solid var(--line)}

/* 固定畫面：只有可捲動的區塊能捲動，其餘位置拖曳不會帶動整個畫面 */
(function(){
  const can=(el,dy)=>{for(;el&&el!==document.body;el=el.parentElement){const o=getComputedStyle(el).overflowY;
    if((o==='auto'||o==='scroll')&&el.scrollHeight>el.clientHeight+1){
      if(dy>0&&el.scrollTop>0)return true;               // 手指向下：內容往上回捲
      if(dy<0&&el.scrollTop+el.clientHeight<el.scrollHeight-1)return true;}}return false;};
  let y0=0;
  addEventListener('touchstart',e=>{y0=e.touches[0].clientY;},{passive:true});
  addEventListener('touchmove',e=>{if(e.touches.length>1)return;const t=e.target;
    if(t.closest&&t.closest('input,textarea'))return;
    const dy=e.touches[0].clientY-y0;if(!can(t,dy))e.preventDefault();},{passive:false});
})();

function balances(upTo){
  const m={};S.accounts.forEach(a=>m[a.id]=+a.init||0);
  S.tx.forEach(t=>{
    if(upTo&&(t.pay&&t.type==='e'?t.pay:t.date)>upTo)return;
    if(t.type==='e'){if(t.acc in m)m[t.acc]-=t.amt;}
    else if(t.type==='i'){if(t.acc in m)m[t.acc]+=t.amt;}
    else{if(t.acc in m)m[t.acc]-=t.amt+(t.fee||0);if(t.to in m)m[t.to]+=t.amt;}
  });
  return m;
}
function sum(prefix,book){
  let e=0,i=0;
  S.tx.forEach(t=>{if(t.book!==book||!t.date.startsWith(prefix))return;
    if(t.type==='e')e+=t.amt;else if(t.type==='i')i+=t.amt;else e+=t.fee||0;});
  return {e,i};
}

function sMatch(t){
  if(SP.mode==='x'&&t.type==='t')return false;
  if(SP.mode==='t'&&t.type!=='t')return false;
  const f=SP.f;
  if(f.type&&t.type!==f.type)return false;
  if(f.cats.length&&!f.cats.includes(t.cat))return false;
  if(f.accs.length&&!(f.accs.includes(t.acc)||f.accs.includes(t.to)))return false;
  if(f.members.length&&!f.members.includes(t.member||'自己'))return false;
  const tg=t.tags||[];
  if(f.tags.length&&!f.tags.some(x=>tg.includes(x)))return false;
  if(f.extag.length&&f.extag.some(x=>tg.includes(x)))return false;
  const q=SP.q.trim().toLowerCase();
  if(q){
    const c=t.type==='t'?'轉帳':(S.cats[t.type].find(x=>x.id===t.cat)?.name||'');
    const hay=[t.note,c,t.member,accName(t.acc),t.to?accName(t.to):'',tg.join(' '),String(t.amt),t.meal,t.rest,t.dish,t.src,t.place,t.vehicle,(t.legs||[]).map(x=>x.f+' '+x.t).join(' '),(t.titems||[]).map(x=>x.n).join(' '),(t.items||[]).map(x=>x.n).join(' '),(t.sitems||[]).map(x=>x.n).join(' ')].join(' ').toLowerCase();

}

/* ---------- 報表 ---------- */
function pie(data){
  const tot=data.reduce((a,b)=>a+b.val,0);
  if(!tot)return '<div class="empty" style="padding:30px">本月沒有資料</div>';
  let a0=-Math.PI/2,p='';const R=90,cx=100,cy=100;
  data.forEach(d=>{
    const a=d.val/tot*2*Math.PI;
    if(data.length===1){p+=`<circle cx="100" cy="100" r="${R}" fill="${d.color}"/>`;return;}
    const a1=a0+a;
    p+=`<path d="M${cx} ${cy}L${cx+R*Math.cos(a0)} ${cy+R*Math.sin(a0)}A${R} ${R} 0 ${a>Math.PI?1:0} 1 ${cx+R*Math.cos(a1)} ${cy+R*Math.sin(a1)}Z" fill="${d.color}"/>`;a0=a1;
  });
  return `<svg viewBox="0 0 200 200" class="pie">${p}<circle cx="100" cy="100" r="48" fill="var(--card)"/></svg>`;
}
function bars(rows){
  const max=Math.max(1,...rows.flatMap(r=>[r.a,r.b])),H=110,W2=320,gw=W2/rows.length;
  let s='';
  rows.forEach((r,k)=>{
    const x=k*gw+gw/2,ha=r.a/max*H,hb=r.b/max*H;
    s+=`<rect x="${x-14}" y="${H-ha+4}" width="12" height="${ha}" rx="2" fill="var(--inc)"/><rect x="${x+2}" y="${H-hb+4}" width="12" height="${hb}" rx="2" fill="var(--exp)"/><text x="${x}" y="${H+20}" font-size="11" text-anchor="middle" fill="var(--sub)">${r.label}</text>`;
  });
  return `<svg viewBox="0 0 ${W2} ${H+28}" style="width:100%">${s}</svg>`;
}

/* ---------- 預算頁 ---------- */
function budOf(mode,key){
  const B0=S.budgets[S.cur]||{};
  const store=(mode==='m'?B0.months:B0.years)||{};
  const k=Object.keys(store).filter(x=>x<=key).sort().pop();
  if(k)return {total:store[k].total||0,cats:store[k].cats||{}};
  return mode==='m'?{total:B0.total||0,cats:B0.cats||{}}:{total:0,cats:{}};
}
function budSet(mode,key,fn){
  const B0=S.budgets[S.cur]||(S.budgets[S.cur]={total:0,cats:{}});
  const store=mode==='m'?(B0.months=B0.months||{}):(B0.years=B0.years||{});
  const cur=budOf(mode,key),nb={total:cur.total,cats:Object.assign({},cur.cats)};
  fn(nb);store[key]=nb;save();
}

  const p=bKey();let s=0;

    if(t.type==='e'){if(!catId||t.cat===catId)s+=t.amt;}else if(t.type==='t'&&!catId)s+=t.fee||0;});

function bDays(){
  const p=bKey();let st,en;

  const t0=new Date(today()+'T00:00:00'),total=Math.round((en-st)/864e5)+1;

      :`<div class="bstat"><div><b>${dy.left}</b><small>剩餘天數</small></div><div><b class="${perDay==='--'?'i':''}">${perDay}</b><small>剩餘預算/天</small></div><div><b class="e">${actual}</b><small>實際支出/天</small></div></div>`}`;

const netSum=up=>{const b=balances(up);return S.accounts.reduce((s,a)=>a.noNet?s:s+(b[a.id]||0),0);};
function accEv(aid){
  const a=S.accounts.find(x=>x.id===aid);let bal=+a.init||0;const ev=[];
  const ed=t=>(t.type==='e'&&t.pay)||t.date;
  S.tx.filter(t=>t.acc===aid||t.to===aid).sort((x,y)=>ed(x).localeCompare(ed(y))||(x.ts||0)-(y.ts||0)).forEach(t=>{
    const e={t,d:ed(t),inc:0,exp:0,tin:0,tout:0};
    if(t.type==='e'&&t.acc===aid)e.exp=t.amt;
    else if(t.type==='i'&&t.acc===aid)e.inc=t.amt;

function saveAcct(){

    const old=e.id?(S.accounts.find(x=>x.id===e.id)||{}).bill:null;
    o.bill={pay:e.pay,close:e.close,payDay:e.payDay,payNext:e.payNext,adj:e.adj,auto:!!e.auto,since:(old&&old.auto&&e.auto&&old.since)||today(),done:(old&&old.done)||''};
  }

/* ---------- 固定收支／固定轉帳 ---------- */
const RULES={d:{u:'d',k:1},wd:{u:'wd'},w:{u:'d',k:7},w2:{u:'d',k:14},m:{u:'m',k:1},m2:{u:'m',k:2},q:{u:'m',k:3},m4:{u:'m',k:4},m5:{u:'m',k:5},h:{u:'m',k:6},y:{u:'m',k:12},y2:{u:'m',k:24}};
const ADJ={none:'不調整',before:'提前',after:'順延'};
function dAdd(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function mAdd(ds,n){const [y,m,d]=ds.split('-').map(Number);const t=new Date(y,m-1+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return ymd(t);}
const isWkend=ds=>{const g=new Date(ds+'T00:00:00').getDay();return g===0||g===6;};
const isOff=ds=>isWkend(ds)||isHol(ds);
const fmtD=ds=>{const d=new Date(ds+'T00:00:00');return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日週'+W[d.getDay()];};
function recOcc(r,n){
  const R=RULES[r.rule]||RULES.m;let ds;
  if(R.u==='d')ds=dAdd(r.start,n*R.k);
  else if(R.u==='m')ds=mAdd(r.start,n*R.k);
  else{let d=r.start;while(isWkend(d))d=dAdd(d,1);for(let i=0;i<n;i++){d=dAdd(d,1);while(isWkend(d))d=dAdd(d,1);}ds=d;}
  if(r.byCount){if(n>=r.count)return null;}else if(r.end&&ds>r.end)return null;
  return ds;
}
function recAdj(r,ds){
  if(r.adj==='before'){for(let i=0;i<14&&isOff(ds);i++)ds=dAdd(ds,-1);}
  else if(r.adj==='after'){for(let i=0;i<14&&isOff(ds);i++)ds=dAdd(ds,1);}
  return ds;
}
function recSched(r){const occ=[];for(let n=0;n<600;n++){const o=recOcc(r,n);if(o===null)break;occ.push(recAdj(r,o));}return occ;}
function migrateRec(r){
  if(r.rule!==undefined)return;
  r.rule=r.freq||'m';r.start=r.next||today();r.n=0;r.name=r.name||r.note||'';r.member=r.member||'';r.tags=r.tags||[];
  r.end='';r.byCount=false;r.count=0;r.adj='none';r.fee=r.fee||0;
}
function runRecurring(){
  const lim=dAdd(today(),+(S.set.ahead||0));let ch=false;
  S.recurring.forEach(r=>{
    migrateRec(r);
    for(let g=0;g<800;g++){
      const o=recOcc(r,r.n);if(o===null)break;
      const d=recAdj(r,o);if(d>lim)break;
      S.tx.push({id:uid(),ts:Date.now()+g,book:r.book,type:r.type,amt:r.amt,cat:r.cat||'',acc:r.acc,to:r.to||'',fee:r.fee||0,date:d,note:r.name||'固定收支',member:r.member||'',tags:[...(r.tags||[])],auto:1,rid:r.id});
      r.n++;ch=true;
    }
  });
  if(runCards())ch=true;
  if(ch)save();
}
function runCards(){
  let ch=false;const td=today();
  S.accounts.forEach(a=>{
    const b=a.bill;if(!b||!b.auto||a.type!=='credit'||!b.pay||!b.close||!b.payDay||!S.accounts.some(x=>x.id===b.pay))return;
    const clamp=(y,m,d)=>{const last=new Date(y,m+1,0).getDate();return ymd(new Date(y,m,Math.min(d,last)));};
    const since=b.since||td,sd=new Date(since+'T00:00:00');
    for(let i=-1;i<=2;i++){
      const base=new Date(sd.getFullYear(),sd.getMonth()+i,1),y=base.getFullYear(),m=base.getMonth();
      const close=clamp(y,m,b.close);if(close<since||close>td)continue;if(b.done&&close<=b.done)continue;
      const pm=new Date(y,m+(b.payNext?1:0),1);let pd=clamp(pm.getFullYear(),pm.getMonth(),b.payDay);
      if(pd<=close)pd=mAdd(pd,1);
      pd=recAdj({adj:b.adj},pd);if(pd>td)continue;
      const prev=clamp(y,m-1,b.close);
      let amt=0;
      S.tx.forEach(t=>{const td2=(t.type==='e'&&t.pay)||t.date;if(t.cardAuto||td2<=prev||td2>close)return;
        if(t.acc===a.id){if(t.type==='e')amt+=t.amt;else if(t.type==='i')amt-=t.amt;else if(t.type==='t')amt+=t.amt+(t.fee||0);}});
      amt=Math.round(amt*100)/100;
      if(amt>0)S.tx.push({id:uid(),ts:Date.now()+i,book:S.cur,type:'t',amt,cat:'',acc:b.pay,to:a.id,fee:0,date:pd,note:'信用卡自動繳款',member:'',tags:[],auto:1,cardAuto:1});
      b.done=close;ch=true;
    }
  });
  return ch;
}

const idb=(()=>{let p;

function compress(file,max){max=max||1280;return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.75));};
  img.onerror=()=>{URL.revokeObjectURL(u);rej();};img.src=u;});}
const isOp=c=>'+-×÷−'.includes(c);
const lastNum=s=>s.split(/[+\-×÷−]/).pop();
function calc(s){
  s=String(s||'').replace(/[+\-×÷−.]+$/,'');if(!s)return 0;
  const tk=s.match(/\d+\.?\d*|\.\d+|[+\-×÷−]/g)||[];const out=[+tk[0]||0];
  for(let i=1;i+1<tk.length;i+=2){const o=tk[i],n=+tk[i+1];
    if(o==='×')out[out.length-1]*=n;else if(o==='÷'){if(n)out[out.length-1]/=n;}else out.push(o==='+'?n:-n);}
  return Math.round(out.reduce((a,b)=>a+b,0)*100)/100;
}
function fmtAmt(s){s=String(s||'');const m=s.match(/^(-?)(\d+)(\.\d*)?$/);if(m)return m[1]+(+m[2]).toLocaleString('en-US')+(m[3]||'');return s;}
function kapply(s,k){
  if(k==='⌫')return s.slice(0,-1);
  if(isOp(k)){if(!s)return s;return isOp(s.slice(-1))?s.slice(0,-1)+k:s+k;}
  if(k==='.'){const l=lastNum(s);if(l.includes('.'))return s;return s+(l===''?'0.':'.');}
  const l=lastNum(s);
  if(l===''&&k.length>1)k='0';
  if(l==='0'&&k[0]==='0')return s;
  if(l==='0')s=s.slice(0,-1);
  if(/\.\d\d$/.test(l)||s.length>=14)return s;
  return s+k;
}

const trDB=()=>(S.transit=S.transit||{vehicles:[],gen:[]});

const legTotal=a=>(a||[]).reduce((s,x)=>s+(+x.p||0),0);
const isHSR=v=>/高鐵|thsr|hsr/i.test(v||'');const SEAT={r:'對號座',f:'自由座'};const seatTag=x=>x.s&&SEAT[x.s]?'（'+SEAT[x.s]+'）':'';
const legName=x=>((x.f||x.t)?(x.f||'?')+' → '+(x.t||'?'):(x.n||'交通費'))+seatTag(x);
const legSummary=a=>(a||[]).map(x=>((x.f||x.t)?(x.f||'?')+'→'+(x.t||'?'):(x.n||'交通費'))+seatTag(x)).join('、');
const trRoutes=()=>{const d=trDB();if(F.vehicle){const r=d.vehicles.find(x=>x.name===F.vehicle);return r?r.routes:[];}return d.gen;};
function learnTransit(t){
  const legs=(t.legs||[]).filter(x=>x.f||x.t);if(!t.vehicle&&!legs.length)return;const d=trDB();let r=null;
  if(t.vehicle){r=d.vehicles.find(x=>x.name===t.vehicle);if(!r){r={id:uid(),name:t.vehicle,routes:[]};d.vehicles.push(r);}}
  legs.forEach(l=>{const L=r?r.routes:d.gen;let x=L.find(y=>y.f===l.f&&y.t===l.t);if(!x){x={f:l.f,t:l.t,p:0};L.push(x);}if(l.p>0){if(l.s==='f')x.pf=l.p;else x.p=l.p;}});
}

        if(cur&&imgs[cur])viewDishImg(n,imgs[cur],pick,()=>{const m=dishList().find(x=>x.n===n);if(m&&m.img){try{idb.del(m.img);}catch(e){}delete imgs[m.img];delete DISHIMG[m.img];delete m.img;save();ml.innerHTML=menuHtml(inp.value);pageDraw();}});
        else pick();}
      else if(k==='clr'){F.items=[];redraw();}
      else if(k==='minc'){const n=nm(t),o=F.items.find(x=>x.n===n);if(o)o.q++;else{const m=dishList().find(x=>x.n===n);F.items.push({n,q:1,p:m?m.p||0:0});}redraw();}
      else if(k==='mdec'){const n=nm(t),o=F.items.find(x=>x.n===n);if(o){if(o.q>1)o.q--;else F.items=F.items.filter(x=>x!==o);}redraw();}
      else if(k==='mdel'){const n=nm(t);if(!confirm('從菜單刪除「'+n+'」？（已記的帳不受影響）'))return;const L=dishList(),j=L.findIndex(x=>x.n===n);if(j>=0){if(L[j].img){try{idb.del(L[j].img);}catch(e){}delete DISHIMG[L[j].img];}L.splice(j,1);}F.items=F.items.filter(x=>x.n!==n);save();redraw();}
      else if(k==='prest'){F.rest=d.rests[i].name;rin.value=F.rest;redraw();}
      else if(k==='delr'){ev.stopPropagation();const n=d.rests[i].name;if(!confirm('從清單刪除餐廳「'+n+'」？（已記的帳不受影響）'))return;d.rests.splice(i,1);if(F.rest===n){F.rest='';rin.value='';}save();redraw();}
    };
  });
}
function budgetLeft(){
  const bd=budOf('m',F.date.slice(0,7));if(F.type!=='e'||!bd||!(bd.cats&&bd.cats[F.cat]>0))return null;
  const m=F.date.slice(0,7);let sp=0;
  S.tx.forEach(t=>{if(t.book===S.cur&&t.type==='e'&&t.cat===F.cat&&t.date.startsWith(m)&&t.id!==F.id)sp+=t.amt;});
  return bd.cats[F.cat]-sp;
}

async function saveForm(again){

  const t={id:F.id||uid(),ts:old?.ts||Date.now(),book:old?.book||S.cur,type:F.type,amt,cat:F.type==='t'?'':F.cat,acc:F.acc,to:F.type==='t'?F.to:'',fee:F.type==='t'?calc(F.fee):0,date:F.date,note:String(F.note).trim(),member:F.type==='t'?'':F.member,tags:[...F.tags],photos:F.ph.map(p=>p.id)};

  if(isSal()){t.src=F.src||'';t.sitems=F.sitems.filter(x=>x.n).map(x=>({n:x.n,a:x.a}));learnSal(t);}
  if(isFood()){t.meal=F.meal||'';t.rest=F.rest||'';t.dish=dishSummary(F.items)||F.dish||'';t.items=F.items.filter(x=>x.n).map(x=>({...x}));learnEat(t);}
  try{for(const p of F.ph)if(p.n&&p.url)await idb.put(p.id,p.url);for(const id of F.delPh)await idb.del(id);}catch(e){alert('照片儲存失敗，這筆記錄仍會儲存');t.photos=[];}
  if(old)S.tx[S.tx.findIndex(x=>x.id===t.id)]=t;else S.tx.push(t);
  if(!F.id&&F.rep){S.recurring.push({id:uid(),book:t.book,type:t.type,name:t.note,amt,cat:t.cat,acc:t.acc,to:t.to,fee:t.fee||0,member:t.member||'',tags:[...t.tags],rule:F.rep,start:F.date,end:'',byCount:false,count:0,adj:'none',n:1});runRecurring();}
  ui.month=t.date.slice(0,7);ui.sel=t.date;

  if(again){Object.assign(F,{amt:'',fee:'',note:'',tags:[],ph:[],delPh:[],kt:'amt',kp:true,rep:''});pageDraw();render();}
  else{closeForm();render();}
}

async function sha(s){
  if(!(window.crypto&&crypto.subtle))return 'p:'+s;
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mdj'+s));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

async function tryUnlock(){

  else if(v.length>=8){$('#pin').value='';}
}

(function(){
  const W=204;let g=null,sup=0;
  const closeAll=ex=>document.querySelectorAll('.swr.open').forEach(w=>{if(w!==ex){w.classList.remove('open');w.querySelector('.row').style.transform='';}});
  document.addEventListener('pointerdown',e=>{
    const r=e.target.closest('.swr .row');if(!r||e.target.closest('.swa'))return;
    const w=r.parentNode;if(!w.classList.contains('open'))closeAll(w);
    g={w,r,x:e.clientX,y:e.clientY,base:w.classList.contains('open')?-W:0,on:false,dx:0,id:e.pointerId};
  });
  document.addEventListener('pointermove',e=>{
    if(!g||e.pointerId!==g.id)return;
    const dx=e.clientX-g.x,dy=e.clientY-g.y;
    if(!g.on){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2){g.on=true;g.w.classList.add('drag');}
      else if(Math.abs(dy)>10){g=null;return;}else return;}
    g.dx=dx;g.r.style.transform='translateX('+Math.max(-W-30,Math.min(0,g.base+dx))+'px)';
  });
  const end=e=>{
    if(!g||(e.pointerId!==undefined&&e.pointerId!==g.id))return;
    const o=g;g=null;if(!o.on)return;
    o.w.classList.remove('drag');sup=Date.now()+350;
    const pos=Math.max(-W,Math.min(0,o.base+o.dx));
    const open=o.base?pos<-W*0.7:pos<-W*0.35;
    o.w.classList.toggle('open',open);o.r.style.transform=open?'translateX('+(-W)+'px)':'';
  };
  document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
  document.addEventListener('click',e=>{
    if(Date.now()<sup){e.stopPropagation();e.preventDefault();return;}
    const r=e.target.closest('.swr .row');
    if(r&&r.parentNode.classList.contains('open')){e.stopPropagation();e.preventDefault();closeAll();return;}
    if(!e.target.closest('.swa'))closeAll();
  },true);
})();

function petPos(){const r=petRoom(),c=$('#petcat');if(!r||!c)return;
  const W=r.clientWidth,H=r.clientHeight,sc=.7+.45*Math.min(1,Math.max(0,PET.y/Math.max(1,H-215)));
  c.style.transform=`translate(${PET.x}px,${PET.y}px) scale(${sc})`;c.style.zIndex=Math.round(PET.y);
  c.style.transformOrigin='50% 100%';c.querySelector('.sp').style.transform=`scaleX(${PET.dir})`;}
function petSay(t,ms=1800){const b=$('#petsay');if(!b)return;b.textContent=t;b.classList.add('on');clearTimeout(PET.say);PET.say=setTimeout(()=>b.classList.remove('on'),ms);}
function petHeart(n=3){const r=petRoom();if(!r)return;for(let i=0;i<n;i++){const h=document.createElement('div');h.className='pt-heart';h.textContent=['💗','💖','💕'][i%3];
  h.style.left=(PET.x+80+Math.random()*60)+'px';h.style.top=(PET.y-10+Math.random()*20)+'px';h.style.animationDelay=(i*.15)+'s';r.appendChild(h);setTimeout(()=>h.remove(),1500);}}
function petStats(){const d=petDB(),el=$('#petstat');if(el)el.textContent='💗 '+d.love+'　🐟 '+d.fed;}
function petMood(){const d=S.tx.some(t=>t.book===S.cur&&t.date===today());return d?['喵～','今天有記帳，好棒！','摸摸我～','喵嗚～']:['今天記帳了嗎？','喵？還沒記帳喔','餓了…也想記帳','喵～'];}
function petRand(){const r=petRoom();PET.tx=Math.random()*(r.clientWidth-240);PET.ty=r.clientHeight*.42+Math.random()*(r.clientHeight*.58-215);PET.mode='walk';}
function petClamp(){const r=petRoom();PET.x=Math.min(Math.max(-20,PET.x),r.clientWidth-215);PET.y=Math.min(Math.max(r.clientHeight*.2,PET.y),r.clientHeight-215);}
function petTick(t){
  if(!PET.on)return;const dt=Math.min(.05,(t-PET.last)/1000||0);PET.last=t;const c=$('#petcat');
  if(c&&!PET.drag){
    if(PET.eatT>0){PET.eatT-=dt;c.className='cat eat';if(PET.eatT<=0){const d=petDB();d.fed++;d.love+=2;save();petStats();petHeart(4);petSay('好好吃！');PET.bowl=null;const b=$('#petbowl');if(b)b.remove();PET.wait=2;c.className='cat';}}
    else if(PET.tx!=null){
      const dx=PET.tx-PET.x,dy=PET.ty-PET.y,d=Math.hypot(dx,dy),sp=(PET.bowl?110:70)*dt;
      if(d<=Math.max(4,sp)){PET.x=PET.tx;PET.y=PET.ty;PET.tx=PET.ty=null;c.classList.remove('walk');
        if(PET.bowl){PET.eatT=2.2;PET.dir=PET.bowl.x>PET.x?1:-1;}else PET.wait=1.5+Math.random()*3.5;}
      else{PET.x+=dx/d*sp;PET.y+=dy/d*sp;if(Math.abs(dx)>3)PET.dir=dx>0?1:-1;c.classList.add('walk');}
    }else{PET.wait-=dt;c.classList.remove('walk');if(PET.wait<=0){if(Math.random()<.22)petSay(petMood()[Math.floor(Math.random()*4)]);petRand();}}
    petPos();
  }
  PET.raf=requestAnimationFrame(petTick);
}
function petOpen(){
  const d=petDB(),el=$('#petpage');
  el.innerHTML=`<div class="pt-h"><button data-pet="close">✕</button><div class="pn" data-pet="rename">${esc(d.name)}<small id="petstat"></small></div><button data-pet="rename" style="font-size:20px">✎</button></div>
  <div id="petroom"><div class="plant">🪴</div><div class="rug"></div>
  <div class="cat" id="petcat"><div class="pt-say" id="petsay"></div><div class="sp">${CAT_SVG}</div><div class="shadow"></div></div></div>
  <div class="pt-b"><button data-pet="pat"><span>🤚</span>摸摸</button><button data-pet="feed"><span>🐟</span>餵食</button><button data-pet="call"><span>📣</span>過來</button></div>`;
  el.classList.add('on');PET.on=true;petStats();
  const r=petRoom();PET.x=d.x*(r.clientWidth-240);PET.y=Math.max(r.clientHeight*.2,d.y*(r.clientHeight-215));PET.dir=d.dir||1;PET.tx=PET.ty=null;PET.wait=1;PET.bowl=null;PET.eatT=0;PET.drag=false;
  petClamp();petPos();PET.last=performance.now();cancelAnimationFrame(PET.raf);PET.raf=requestAnimationFrame(petTick);
  setTimeout(()=>petSay(petMood()[0]),400);
}
function petClose(){const d=petDB(),r=petRoom();if(r){d.x=PET.x/Math.max(1,r.clientWidth-240);d.y=PET.y/Math.max(1,r.clientHeight-215);d.dir=PET.dir;}save();PET.on=false;cancelAnimationFrame(PET.raf);$('#petpage').classList.remove('on');$('#petpage').innerHTML='';}
function petPat(){const d=petDB(),c=$('#petcat');d.love++;save();petStats();petHeart(3);petSay(['呼嚕呼嚕～','喵～','好舒服','再摸一下'][Math.floor(Math.random()*4)],1200);c.classList.add('love');setTimeout(()=>c.classList.remove('love'),1100);}
function petFeed(){const r=petRoom();if(PET.bowl){petSay('碗已經在那邊囉');return;}
  const bx=40+Math.random()*(r.clientWidth-130),by=r.clientHeight*.55+Math.random()*(r.clientHeight*.3);
  const b=document.createElement('div');b.className='pt-bowl';b.id='petbowl';b.textContent='🐟';b.style.left=bx+'px';b.style.top=by+'px';r.appendChild(b);
  PET.bowl={x:bx};PET.tx=Math.min(Math.max(-20,bx-80),r.clientWidth-215);PET.ty=Math.min(by-60,r.clientHeight-215);PET.eatT=0;petSay('有魚！！');}
document.addEventListener('pointerdown',e=>{
  const c=e.target.closest('#petcat');const r=petRoom();if(!PET.on||!r||!r.contains(e.target))return;
  if(c){e.preventDefault();const rect=r.getBoundingClientRect();PET.drag=true;PET.tx=PET.ty=null;PET.eatT=0;
    const sx=e.clientX,sy=e.clientY,ox=e.clientX-rect.left-PET.x,oy=e.clientY-rect.top-PET.y;let moved=false;
    c.classList.add('drag');c.classList.remove('walk');
    const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>6)moved=true;if(!moved)return;PET.x=ev.clientX-rect.left-ox;PET.y=ev.clientY-rect.top-oy;petClamp();petPos();};
    const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);PET.drag=false;c.classList.remove('drag');PET.wait=2+Math.random()*2;if(!moved)petPat();else petSay('喵～放我下來～',1200);};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  }else if(e.target===r||e.target.classList.contains('rug')||e.target.classList.contains('plant')){
    const rect=r.getBoundingClientRect();PET.tx=Math.min(Math.max(-20,e.clientX-rect.left-120),r.clientWidth-215);PET.ty=Math.min(Math.max(r.clientHeight*.2,e.clientY-rect.top-110),r.clientHeight-215);if(PET.bowl){PET.bowl=null;const b=$('#petbowl');if(b)b.remove();}}
});
document.addEventListener('click',e=>{const el=e.target.closest('[data-pet]');if(!el)return;const k=el.dataset.pet;
  if(k==='close')petClose();else if(k==='pat')petPat();else if(k==='feed')petFeed();
  else if(k==='call'){const r=petRoom();PET.tx=r.clientWidth/2-120;PET.ty=r.clientHeight-240;PET.bowl=null;petSay('來了來了～');}
  else if(k==='rename'){const d=petDB(),n=prompt('幫牠取個名字',d.name);if(n&&n.trim()){d.name=n.trim().slice(0,8);save();el.closest('#petpage').querySelector('.pn').firstChild.textContent=d.name;}}
});
act.pet=()=>petOpen();
applyTheme();runRecurring();lock();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

  K.tail.r[0]=-.5+Math.sin(t*1.3)*.05;K.tail.tw=[Math.sin(t*1.9)*(.1+.06*w),Math.sin(t*1.4+1)*.05-.04*w];
  }
  K.shadow.p=[c.x,.014,c.z];K.shadow.r=[0,c.yaw,0];K.shadow.sc=[.62*(1-c.lift*.3),1,.95*(1-c.lift*.3)];K.shadow.a=.26-c.lift*.12;
  K.head.hide=(P3.view==='eye');
}
function updateCam(dt){const c=P3.cat,v=P3.view,cam=P3.cam,f=[Math.sin(c.yaw),0,Math.cos(c.yaw)],r=[Math.cos(c.yaw),0,-Math.sin(c.yaw)],tg=[c.x,.4+c.lift,c.z];let dp,dt2,k=4,up=[0,1,0];
  if(v==='chase'){dp=[tg[0]-f[0]*3.9,1.9,tg[2]-f[2]*3.9];dt2=[tg[0]+f[0]*.5,.3,tg[2]+f[2]*.5];}
  else if(v==='side'){dp=[tg[0]+r[0]*4.2,.9,tg[2]+r[2]*4.2];dt2=[tg[0],.4,tg[2]];}
  else if(v==='front'){dp=[tg[0]+f[0]*3.7,.95,tg[2]+f[2]*3.7];dt2=[tg[0],.5,tg[2]];}
  else if(v==='top'){dp=[tg[0],6.5,tg[2]+.01];dt2=[tg[0],0,tg[2]];up=[0,0,-1];k=6;}
  else if(v==='room'){dp=[0,5.2,8.2];dt2=[0,.3,0];k=3;}
  else if(v==='free'){const q=P3.free;dp=[tg[0]+q.dist*Math.cos(q.el)*Math.sin(q.az),.3+q.dist*Math.sin(q.el),tg[2]+q.dist*Math.cos(q.el)*Math.cos(q.az)];dt2=tg;k=7;}
  else{dp=[c.x+f[0]*.34,.78,c.z+f[2]*.34];dt2=[c.x+f[0]*3,.62,c.z+f[2]*3];k=9;}
  const a=1-Math.exp(-dt*k);for(let i=0;i<3;i++){cam.p[i]+=(dp[i]-cam.p[i])*a;cam.t[i]+=(dt2[i]-cam.t[i])*a;}
  P3.up=up;}
function render(){const g=P3.g,gl=g.gl,cv=P3.cv,rc=cv.parentElement,dpr=Math.min(1.75,devicePixelRatio||1),W=Math.max(2,Math.round(rc.clientWidth*dpr)),H=Math.max(2,Math.round(rc.clientHeight*dpr));
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}gl.viewport(0,0,W,H);gl.clearColor(.96,.92,.85,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  const vp=M4.mul(M4.persp(FOV,W/H,.12,60),M4.look(P3.cam.p,P3.cam.t,P3.up||[0,1,0]));P3.vp=vp;
  gl.uniformMatrix4fv(g.loc.u_vp,false,vp);gl.uniform3fv(g.loc.u_cam,P3.cam.p);
  const I=M4.T(0,0,0);draw(g,P3.room,I,0);draw(g,P3.cat.cat.root,I,0);
  gl.depthMask(false);draw(g,P3.cat.cat.shadow,I,1);gl.depthMask(true);
  const b=document.getElementById('p3say');if(b&&b.classList.contains('on')){const s=proj(P3.cat.x,1.15+P3.cat.lift,P3.cat.z);if(s){b.style.left=clamp(s[0],70,rc.clientWidth-70)+'px';b.style.top=clamp(s[1]-30,50,rc.clientHeight-40)+'px';}}}
function frame(ts){if(!P3.on)return;const dt=Math.min(.1,(ts-P3.last)/1000||0);P3.last=ts;P3.t+=dt;try{update(dt,P3.t);updateCam(dt);render();}catch(e){console.error(e);}P3.raf=requestAnimationFrame(frame);}

/* ---------- 開啟 / 關閉 ---------- */
function setView(v,quiet){P3.view=v;const d=petDB();d.view=v;if(v==='free'){P3.free.az=P3.cat.yaw+Math.PI;P3.free.el=.5;P3.free.dist=4.6;}
  document.querySelectorAll('#pt3room .pt-v button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(!quiet){const h=document.getElementById('p3hint');if(h){h.textContent=v==='free'?'拖曳畫面旋轉視角・雙指縮放':v==='eye'?'貓咪的視角':'點地板讓貓走過去';h.classList.add('on');clearTimeout(P3.hint);P3.hint=setTimeout(()=>h.classList.remove('on'),2200);}}}
async function open3(){
  const d=petDB(),el=document.getElementById('petpage');
  el.innerHTML=`<div class="pt-h"><button data-pet="close">✕</button><div class="pn" data-pet="rename">${esc(d.name)}<small id="petstat"></small></div><button data-pet="rename" style="font-size:20px">✎</button></div>
  <div id="pt3room"><canvas id="pt3cv"></canvas><div class="pt-v">${VIEWS.map(v=>`<button data-v="${v[0]}">${v[1]}</button>`).join('')}</div><div class="pt-say" id="p3say"></div><div class="pt-hint" id="p3hint"></div></div>
  <div class="pt-b"><button data-pet3="pat"><span>🤚</span>摸摸</button><button data-pet3="feed"><span>🐟</span>餵食</button><button data-pet3="call"><span>📣</span>過來</button></div>`;
  el.classList.add('on');petStats();
  P3.cv=document.getElementById('pt3cv');P3.g=mkGL(P3.cv);P3.L=lib();
  P3.room=buildRoom(P3.L);const tok=++P3.tok;let cat=null;
  try{await loadGLB();cat=buildGLBCat(P3.L);}catch(err){console.warn('glb fallback',err);cat=buildCat(P3.L);}
  if(tok!==P3.tok)return;
  P3.cat={cat,x:isFinite(d.px)?d.px:0,z:isFinite(d.pz)?d.pz:1.2,yaw:d.yaw||0,want:d.yaw||0,tx:null,tz:null,wait:1,mode:'idle',phase:0,wk:0,lift:0,happyT:0,eatK:0,eatT:0};
  P3.bowl=null;P3.drag=false;P3.ptr.clear();P3.on=true;P3.t=0;
  setView(VIEWS.some(v=>v[0]===d.view)?d.view:'chase',true);
  const c=P3.cat,f=[Math.sin(c.yaw),0,Math.cos(c.yaw)];P3.cam.p=[c.x-f[0]*3.9,1.9,c.z-f[2]*3.9];P3.cam.t=[c.x,.4,c.z];
  bind3();P3.last=performance.now();cancelAnimationFrame(P3.raf);P3.raf=requestAnimationFrame(frame);setTimeout(()=>{if(P3.on)say3(petMood()[0]);},500);}
function close3(){P3.tok++;const d=petDB(),c=P3.cat;if(c){d.px=c.x;d.pz=c.z;d.yaw=c.yaw;}save();P3.on=false;cancelAnimationFrame(P3.raf);
  try{const e=P3.g&&P3.g.gl.getExtension('WEBGL_lose_context');e&&e.loseContext();}catch(e){}
  const el=document.getElementById('petpage');el.classList.remove('on');el.innerHTML='';P3.g=null;LIB&&(()=>{const strip=m=>{if(!m)return;if(Array.isArray(m))return m.forEach(strip);if(m.P){m.vb=m.ib=m.g=null;}};Object.values(LIB).forEach(strip);})();}

/* ---------- 操作 ---------- */
function bind3(){const cv=P3.cv;
  cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);P3.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,moved:false});
    if(P3.ptr.size===1){P3.tap={cat:catHit(e.clientX,e.clientY)};}else P3.tap=null;if(P3.ptr.size===2){const a=[...P3.ptr.values()];P3.pd=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);P3.pd0=P3.free.dist;}});
  cv.addEventListener('pointermove',e=>{const p=P3.ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)>8)p.moved=true;
    if(P3.ptr.size===2&&P3.view==='free'){const a=[...P3.ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);P3.free.dist=clamp(P3.pd0*P3.pd/Math.max(10,d),1.6,8);return;}
    if(P3.ptr.size!==1)return;
    if(P3.tap&&P3.tap.cat&&p.moved){P3.drag=true;P3.cat.eatT=0;P3.cat.tx=null;const h=floorHit(e.clientX,e.clientY);if(h){P3.cat.x=clamp(h[0],-BND-.2,BND+.2);P3.cat.z=clamp(h[1],-BND-.2,BND+.2);}}
    else if(P3.view==='free'&&p.moved&&!(P3.tap&&P3.tap.cat)){P3.free.az-=dx*.008;P3.free.el=clamp(P3.free.el+dy*.006,.08,1.45);}});
  const end=e=>{const p=P3.ptr.get(e.pointerId);if(!p)return;P3.ptr.delete(e.pointerId);
    if(P3.drag){P3.drag=false;P3.cat.wait=2+Math.random()*2;say3('喵～放我下來～',1200);return;}
    if(!p.moved&&P3.tap&&e.type==='pointerup'){if(P3.tap.cat)pat3();else{const h=floorHit(e.clientX,e.clientY);if(h){const c=P3.cat;c.tx=clamp(h[0],-BND,BND);c.tz=clamp(h[1],-BND,BND);c.eatT=0;if(P3.bowl){const i=P3.room.kids.indexOf(P3.bowl.node);if(i>=0)P3.room.kids.splice(i,1);P3.bowl=null;}}}}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  cv.addEventListener('wheel',e=>{if(P3.view==='free'){e.preventDefault();P3.free.dist=clamp(P3.free.dist*(1+e.deltaY*.001),1.6,8);}},{passive:false});
  document.querySelectorAll('#pt3room .pt-v button').forEach(b=>b.onclick=()=>setView(b.dataset.v));}
document.addEventListener('click',e=>{const el=e.target.closest('[data-pet3]');if(!el||!P3.on)return;const k=el.dataset.pet3;
  if(k==='pat')pat3();else if(k==='feed')feed3();else if(k==='call'){const c=P3.cat;c.tx=clamp(P3.cam.p[0]*.6,-BND,BND);c.tz=clamp(P3.cam.p[2]*.6,-BND,BND);c.eatT=0;say3('來了來了～');}});

/* ---------- 接到原本的寵物入口 ---------- */
const old2D=petClose;
petClose=function(){if(P3.on){close3();return;}old2D();};
act.pet=()=>{if(!glOK()){petOpen();return;}open3().catch(err=>{console.error(err);try{close3();}catch(e){}petOpen();});};
window.__P3=P3;
})();

</script>
